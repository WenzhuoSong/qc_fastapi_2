- key: pullback_buy_point_worse
  kind: method
  polarity: negative
  status: rejected
  title: 等价位图的回调买点不如直接买入
  claim: 价位图给出回调买点后挂单等待，成交后的净收益前后两半都低于次日开盘直接买入（同样的止损止盈方法）。
  mechanism: 能跌进回调区间的股票，往往是走弱的那一部分（逆向选择）；真正强的股票不回调就走了。
  context: {kind: [stock]}
  applies: {lenses: [support_resistance], topics: [entry]}
  evidence:
    - source: level_study
      date: 2026-10-27
      summary: 每 5 个交易日按当时数据重建价位图；回调买点 205774 笔，净收益 +0.75% / +0.23%（前半 / 后半），直接买入 +1.10% / +0.40%。
  invalidation: —
  recheck_on: 2027-10-28

- key: breakout_needs_close_confirmation
  kind: method
  polarity: positive
  status: backtested
  title: 突破买点要等放量收盘确认，不要盘中触及就买
  claim: 价位图的突破买点，放量（≥ 1.5 倍均量）收盘站上再按收盘成交，前后两半都明显好于盘中触及就成交；但两者都没有胜过直接买入。
  mechanism: 盘中触及后回落的假突破很多；收盘和量能确认过滤掉了大部分。
  context: {kind: [stock]}
  applies: {lenses: [support_resistance], topics: [entry]}
  evidence:
    - source: level_study
      date: 2026-10-27
      summary: 放量收盘确认 8996 笔，净收益 +0.85% / +0.83%（前半 / 后半）；盘中触及 122136 笔，+0.60% / +0.07%；直接买入 +1.10% / +0.40%。
  invalidation: 前向记录中收盘确认不再好于盘中触及。
  recheck_on: 2027-04-28

- key: exit_scale_out_costs
  kind: method
  polarity: positive
  status: backtested
  title: 出场：分批止盈降低收益，不分批、到目标 1 后才启用吊灯止损最好
  claim: 在所有规则信号上比较出场方式，不分批、到目标 1 后才启用吊灯止损，前后两半的净收益都最高；现行的"目标 1 卖 1/3、其余吊灯止损"排在中间。
  mechanism: 分批止盈和过早收紧的止损都截断了少数大涨的交易，而均值主要靠它们。
  context: {kind: [stock]}
  applies: {topics: [exit]}
  evidence:
    - source: exit_study
      date: 2026-10-27
      summary: 25113 笔成交；不分批、到目标 1 后才启用吊灯止损 +1.55% / +1.13%（前半 / 后半）；不移动止损 +1.48% / +1.08%；不分批、全部用吊灯止损 +1.25% / +0.96%；目标 1 卖 1/3、其余吊灯止损（现行）+1.09% / +0.81%。
  invalidation: 前向持仓记录中现行方式不再落后。
  recheck_on: 2027-04-28
  note: 持仓管理是否改用最优方式，等用户决定。

- key: hold_drift_benchmark_biased
  kind: method
  polarity: negative
  status: rejected
  title: 用"相对持有该股的平均涨幅"评价规则有偏差
  claim: 原来的规则基准用的是该股整段历史的平均日涨幅：既用到了未来，又建立在当前指数成分股（过去的赢家）上，对规则是偏高的门槛，不能单独作为结论。评价规则要用同日随机股票和同股随机日期这类当时就能得到的对照。
  context: {}
  applies: {topics: [evaluation]}
  evidence:
    - source: rule_benchmarks
      date: 2026-10-28
      summary: 放量异动按原基准只比持有多 +0.05%，按公平对照前后两半方向不一致；突破回踩按公平对照相对同日随机股票 +0.89%（t 4.97）。
  invalidation: —
  recheck_on: 2027-10-28

# ── P4: methods for industry theses (kind judgment). AI judgments are validated forward only:
#    each starts as a hypothesis and moves to forward on first use (scout.outlook).

- key: method_estimate_revisions
  kind: judgment
  polarity: positive
  status: hypothesis
  title: 行业盈利预期修正面
  claim: 一个行业里多数公司的盈利预期在被上调（或下调），上调面持续扩大的行业，未来 60–120 个交易日倾向跑赢大盘；反之跑输。
  mechanism: 分析师修正有惯性，信息逐步进入预期和价格（盈利动量，Chan、Jegadeesh 与 Lakonishok 1996）。
  context: {}
  applies: {topics: [sector_thesis]}
  evidence: []
  invalidation: 30 个以上样本后，按此方法的判断 60 日命中率不高于 50%。
  recheck_on: 2027-10-28

- key: method_capex_cycle
  kind: judgment
  polarity: positive
  status: hypothesis
  title: 资本开支周期传导
  claim: 下游多家公司同时大幅增加资本开支时，上游设备、材料和供应商行业的收入随后加速；资本开支收缩时相反。
  mechanism: 资本开支就是上游的订单，从下游财报披露到上游收入确认有一到几个季度的时滞。
  context: {}
  applies: {topics: [sector_thesis]}
  evidence: []
  invalidation: 30 个以上样本后，按此方法的判断 60 日命中率不高于 50%。
  recheck_on: 2027-10-28

- key: method_revenue_acceleration
  kind: judgment
  polarity: positive
  status: hypothesis
  title: 行业收入增速拐点
  claim: 一个行业里收入增速加快的公司占多数、且中位数增速上行时，基本面拐点尚未被完全定价。
  mechanism: 投资者对增速变化反应不足，财报一个季度一个季度地确认趋势（盈利公告后漂移的行业层面版本）。
  context: {}
  applies: {topics: [sector_thesis]}
  evidence: []
  invalidation: 30 个以上样本后，按此方法的判断 60 日命中率不高于 50%。
  recheck_on: 2027-10-28

- key: method_policy_regulation
  kind: judgment
  polarity: positive
  status: hypothesis
  title: 政策与监管走向
  claim: 已经公布、但要几个季度才落实到盈利的政策或监管变化（补贴、关税、审批、价格管制），其影响会逐步反映在行业表现上。
  mechanism: 政策从公布到影响收入和成本有时滞，市场对二阶影响的定价不充分。
  context: {}
  applies: {topics: [sector_thesis]}
  evidence: []
  invalidation: 30 个以上样本后，按此方法的判断 60 日命中率不高于 50%。
  recheck_on: 2027-10-28

- key: method_macro_transmission
  kind: judgment
  polarity: positive
  status: hypothesis
  title: 宏观变量传导
  claim: 利率、美元、油价或信用利差出现持续变化时，对这些变量敏感的行业（银行、地产、能源、公用事业等）的盈利和估值会随之调整。
  mechanism: 宏观变量通过融资成本、商品价格和贴现率影响行业盈利，分析师预期调整滞后。
  context: {}
  applies: {topics: [sector_thesis]}
  evidence: []
  invalidation: 30 个以上样本后，按此方法的判断 60 日命中率不高于 50%。
  recheck_on: 2027-10-28

- key: conditional_cells_no_signal
  kind: method
  polarity: negative
  status: rejected
  title: 把规则细分到板块 × 市况，找不到比规则整体更好的组合
  claim: 7 条规则的历史成交按板块 × 市况（以及单独按板块、市况、波动状态）细分后，各组合相对同日随机股票的差异没有超出抽样误差；组合不比规则整体提供更多信息，看规则整体即可。
  mechanism: 每个组合的笔数有限（多数几十到几百笔），收益波动大；市况和板块又集中在同一段时间，组合之间并不独立。看起来好的组合主要是运气。
  context: {kind: [stock]}
  applies: {topics: [evaluation, entry]}
  evidence:
    - source: conditional_rates_v1
      date: 2026-11-03
      summary: 25774 笔成交、7 条规则。除逆向超跌和板块轮动外，组合间真实差异的方差估计为 0，每个组合都被完全收缩到规则均值；按预登记公式得到的 21 个"候选"都来自这种零宽度区间（公式没有计入规则均值本身的误差），不是组合自身的证据。唯一有独立信息的是逆向超跌 × 房地产 × 上升市（84 笔，收缩后 +0.50%，90% 区间下限 +0.03%），计入规则均值误差后下限约 -0.01%，不成立。规则整体：突破回踩相对同日随机股票 +0.85%（90% 区间 +0.58% 到 +1.12%，前后两半 +0.80% / +0.90%），其余规则整体区间都包含 0 或为负。
  invalidation: 换一种预先登记的条件维度（不是板块或市况）在新数据上找到独立的差异。
  recheck_on: 2027-11-03
  note: 预登记的后验标准差公式在组合间方差估计为 0 时退化为零宽度区间；按预登记不改维度或阈值重算。候选不登记前向验证。

- key: sector_rrg_quadrants_no_edge
  kind: method
  polarity: negative
  status: rejected
  title: 按板块轮动象限交易（进入改善买、进入转弱卖）没有优势
  claim: 用 Scout 自己的轮动象限，板块 ETF 进入"改善"时买入、进入"转弱"时卖出，扣成本后不比同期其他板块好，组合也不比一直持有 SPY 或板块等权好；它降低的回撤来自一半时间持有现金，现行的大盘过滤做得更好。
  mechanism: 象限由相对强度和它的变化决定，看到"改善"时这段相对走势大多已经发生；板块相对强弱在几周到几个月的尺度上接近随机，信号多数是噪音。
  context: {kind: [etf]}
  applies: {topics: [sector_thesis, entry]}
  evidence:
    - source: sector_rrg_v1
      date: 2026-11-03
      summary: SPDR 板块 ETF 1998–2026，500 笔，持有中位数 49 个交易日；相对同期其他板块每笔 +0.12%，但按入场月份平均 -0.14%（t -0.36）；倾斜版年化 +8.8%、夏普 0.43，SPY 年化 +8.5%、夏普 0.42，板块等权 +8.8%、0.45；现金版年化 +6.1%、最大回撤 -32%，不如 SPY + 大盘过滤（+7.9%、夏普 0.51、回撤 -27%）。掉回落后也卖出的版本更差（每笔 -0.09%）。French 12 行业 1926–1998 同一规则每笔相对其他行业 -0.55%（t -1.94）。
  invalidation: 预先登记的、不同机制的板块信号（不是象限或相对强度动量）在新数据上通过检验关。
  recheck_on: 2027-11-03
  note: 板块轮动方向第 4、5 次否定（此前：板块轮动规则、换仓研究的行业过滤、ML 第 6 阶段的板块层）。不调参数、不换象限定义重算。

- key: scout_system_v1
  kind: method
  polarity: negative
  status: rejected
  title: 突破回踩做成 5 只的完整系统：规则自己的短出场接近通过，20% 移动止损不行
  claim: 突破回踩、最多 5 只、大盘过滤的完整规则系统，在 1999–2026 年市值前 1000（含退市）上，用规则自己的出场（止损 / 2R 目标 / 20 日）时好于同样规则下随机选股，回撤也小，但后半段夏普低于 SPY + 大盘过滤，按预登记不通过；用 20% 移动止损时不比随机选股好。
  mechanism: 突破回踩的优势集中在买入后 1–2 周；20% 移动止损一般持有几个月，把这段优势稀释成普通持股。短出场保住了优势，但每年约 107 笔，对交易成本很敏感。
  context: {kind: [stock]}
  applies: {topics: [entry, exit, system]}
  evidence:
    - source: scout_system_v1
      date: 2026-11-03
