# Pre-registration (G0), written 2026-10-28 before any run of its family. Never edited after a run.
key: rank_short_term_reversal_high_vol
family: short_term_reversal
type: rank
ranker: short_term_reversal
top_frac: 0.1
hold: 21
every: 21
primary_control: select
when:
  vol: [high]
title: 短期反转（只在市场高波动时）
claim: 只在市场处于高波动（SPY 20 日波动高于自身一年中位数）时，按过去 21 个交易日收益排名，跌得最多的 10% 在随后 1 个月跑赢同一天的其他股票。
mechanism: 反转收益是给提供流动性的一方的补偿；市场波动高时流动性提供者少、要价高，所以反转收益更大（Nagel 2012《Evaporating Liquidity》：VIX 高时短期反转收益显著更高）。
expected_failure: 高波动期往往是急跌，跌得多的股票可能继续下跌（2008、2020 年 3 月这种行情）；样本只有约一半的调仓日。
deviations: 用 SPY 的已实现波动代替 VIX；其余同 rank_short_term_reversal。
registration_note: 与 rank_short_term_reversal 同族（本族第 2 次检验，门槛按族内次数计），两条在任何一条运行之前一起登记；条件来自文献，不是看过结果后挑的。
registered_on: 2026-10-28
