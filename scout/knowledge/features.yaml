# Scout 特征数据字典（唯一口径）
#
# 每个特征：zh 中文名 · unit 单位 · definition 定义/公式 · readings 解读区间 · caveat 注意事项
# unit: pct（小数，0.05 = 5%，带正负号）| pct_mag（幅度类百分比，不带正负号）| ratio | price | sigma | score01（0–1 分位/位置）| rsi | beta | corr | usd
# readings 按顺序匹配，第一个命中生效：{max: x} 表示 值 ≤ x，{min: x} 表示 值 ≥ x，两者都写表示区间。
# 同一份字典驱动：Dashboard 字段名与说明、Scout 分析的判断阈值、交给 LLM 的"数值 + 读数"证据。

close:
  zh: 收盘价
  unit: price
  definition: 最近一个交易日的复权收盘价（yfinance，已按拆股和分红调整）。

ret_1d:
  zh: 1 日涨跌
  unit: pct
  definition: 今日收盘 / 昨日收盘 − 1。
ret_5d:
  zh: 5 日涨跌
  unit: pct
  definition: 近 5 个交易日（约一周）的累计涨跌。
ret_20d:
  zh: 20 日涨跌
  unit: pct
  definition: 近 20 个交易日（约一个月）的累计涨跌。
ret_63d:
  zh: 3 个月涨跌
  unit: pct
  definition: 近 63 个交易日的累计涨跌，中期动量的主要窗口。
ret_252d:
  zh: 1 年涨跌
  unit: pct
  definition: 近 252 个交易日的累计涨跌，长期动量窗口。

sma20:
  zh: 20 日均线
  unit: price
  definition: 近 20 日收盘价的简单平均，短期趋势参照。
sma50:
  zh: 50 日均线
  unit: price
  definition: 近 50 日收盘价的简单平均，中期趋势参照；机构常用的回调支撑位。
sma200:
  zh: 200 日均线
  unit: price
  definition: 近 200 日收盘价的简单平均，长期趋势分水岭。价格在其上方视为长期多头格局。

atr14:
  zh: ATR(14)
  unit: price
  definition: 14 日平均真实波幅（含跳空），用于设置止损距离。Scout 的止损至少距入场中点 1 个 ATR。
atr_pct:
  zh: 日均振幅
  unit: pct_mag
  definition: ATR(14) / 收盘价，衡量单日正常波动幅度。
  readings:
    - {max: 0.015, text: 低波动（日振幅 ≤ 1.5%）}
    - {max: 0.035, text: 正常波动}
    - {min: 0.035, text: 高波动（日振幅 ≥ 3.5%），止损需更宽、仓位需更小}

vol_ratio:
  zh: 量比
  unit: ratio
  definition: 今日成交量 / 此前 50 日平均成交量。
  readings:
    - {max: 0.7, text: 明显缩量}
    - {max: 1.3, text: 量能正常}
    - {max: 1.8, text: 温和放量}
    - {max: 3.0, text: 明显放量（≥ 1.8 倍），价格变动的可信度更高}
    - {min: 3.0, text: 异常放量（≥ 3 倍），通常有事件驱动}
  caveat: 《股市趋势技术分析》强调成交量应随趋势方向放大；上涨放量、回调缩量是健康的趋势。

dollar_vol20:
  zh: 20 日均成交额
  unit: usd
  definition: 近 20 日（收盘价 × 成交量）的平均，衡量流动性。Scout 只扫描 ≥ 2000 万美元的标的。

dist_52w_high:
  zh: 距 52 周高点
  unit: pct
  definition: 收盘价 / 近 252 日最高价 − 1，恒 ≤ 0。
  readings:
    - {min: -0.03, text: 贴近 52 周高点（3% 以内），上方几乎没有套牢盘}
    - {min: -0.15, text: 距高点不远（15% 以内）}
    - {min: -0.30, text: 明显低于高点，上方存在套牢盘阻力}
    - {max: -0.30, text: 远离高点（跌幅 > 30%），处于深度回撤}

rsi2:
  zh: RSI(2)
  unit: rsi
  definition: 2 日相对强弱指数（Wilder 平滑），对极短期超买超卖非常敏感，用于捕捉强势股的短暂回调。
  readings:
    - {max: 10, text: 极度超卖（≤ 10）}
    - {max: 30, text: 偏超卖}
    - {max: 70, text: 中性}
    - {max: 90, text: 偏超买}
    - {min: 90, text: 极度超买（≥ 90）}
rsi14:
  zh: RSI(14)
  unit: rsi
  definition: 14 日相对强弱指数，经典动量振荡指标。
  readings:
    - {max: 30, text: 超卖区（≤ 30）}
    - {max: 45, text: 偏弱}
    - {max: 55, text: 中性}
    - {max: 70, text: 偏强}
    - {min: 70, text: 超买区（≥ 70）；强趋势中可以长时间停留在这里}

macd_pct:
  zh: MACD 线（占股价）
  unit: pct2
  definition: Appel 的 MACD，标准参数 12/26/9：12 日指数均线 − 26 日指数均线，除以股价以便跨股票比较。大于 0 表示短期均线在长期均线上方，偏多。
  readings:
    - {max: 0.0, text: 零轴下方（短期均线在长期均线下方，偏空）}
    - {min: 0.0, text: 零轴上方（短期均线在长期均线上方，偏多）}
  caveat: 这是对价格趋势的描述，不是买卖信号；检验关里 MACD 金叉作为选股规则另行检验。
macd_hist_pct:
  zh: MACD 柱（占股价）
  unit: pct2
  definition: MACD 线 − 信号线（MACD 的 9 日指数均线），除以股价。由负转正称为金叉，由正转负称为死叉；柱子变长说明动能在加强。
  readings:
    - {max: 0.0, text: 信号线下方（动能偏弱）}
    - {min: 0.0, text: 信号线上方（动能偏强）}
macd_cross_days:
  zh: 距 MACD 上次交叉（交易日）
  unit: count
  definition: MACD 柱上次变号以来的交易日数，正数表示金叉之后，负数表示死叉之后。例如 3 = 三个交易日前金叉，−10 = 十个交易日前死叉。
  readings:
    - {max: -1, text: 死叉之后}
    - {min: 1, text: 金叉之后}

wk_dist_sma30:
  zh: 周线相对 30 周均线
  unit: pct
  definition: 最近一根已完成周线（一周最后一个交易日收盘后才算完成）的收盘价 / 30 周均线 − 1。Weinstein 阶段分析的核心：周线收在上升的 30 周均线上方是第二阶段（上升期）。
  readings:
    - {max: -0.10, text: 远在 30 周均线下方}
    - {max: 0.0, text: 30 周均线下方}
    - {max: 0.10, text: 30 周均线上方}
    - {min: 0.10, text: 远在 30 周均线上方}
  caveat: 当周还没收完时，用的是上一根完整周线，所以周中的价格变化不会反映在这里。
wk_sma30_slope_4w:
  zh: 30 周均线 4 周变化
  unit: pct
  definition: 30 周均线相对 4 周前的变化。向上表示长期趋势在抬升，走平表示阶段转换（第一或第三阶段），向下是第四阶段（下降期）的特征。
  readings:
    - {max: -0.01, text: 30 周均线向下}
    - {max: 0.01, text: 30 周均线走平}
    - {min: 0.01, text: 30 周均线向上}
wk_rsi14:
  zh: 周线 RSI(14)
  unit: rsi
  definition: 用已完成周线算的 14 周 RSI，比日线 RSI 慢得多，反映数月尺度的动能。
  readings:
    - {max: 30, text: 周线超卖}
    - {max: 50, text: 周线偏弱}
    - {max: 70, text: 周线偏强}
    - {min: 70, text: 周线超买；强趋势中可以长期停留}
wk_macd_hist_pct:
  zh: 周线 MACD 柱（占股价）
  unit: pct2
  definition: 周线 MACD（12/26/9 周）的柱子，除以周收盘价。大于 0 表示周线动能偏多。
  readings:
    - {max: 0.0, text: 周线动能偏弱}
    - {min: 0.0, text: 周线动能偏强}
wk_macd_hist_chg:
  zh: 周线 MACD 柱变化
  unit: pct2
  definition: 本周（最近一根完整周线）MACD 柱减上周，除以周收盘价。Elder 三重滤网的第一层：柱子上升表示周线趋势转强，只考虑做多。
  readings:
    - {max: 0.0, text: 周线柱下降（周线动能在减弱）}
    - {min: 0.0, text: 周线柱上升（周线动能在增强）}
wk_vol_ratio:
  zh: 周成交量 / 前 4 周均量
  unit: ratio
  definition: 最近一根完整周线的成交量，除以之前 4 周的平均周成交量。Weinstein 要求突破 30 周均线时成交量至少是前几周平均的 2 倍。
  readings:
    - {max: 0.8, text: 缩量}
    - {max: 1.5, text: 量能正常}
    - {max: 2.0, text: 放量}
    - {min: 2.0, text: 显著放量（≥ 2 倍）}

gap_pct:
  zh: 开盘跳空
  unit: pct
  definition: 今日开盘价 / 昨日收盘价 − 1。
  readings:
    - {max: -0.03, text: 向下跳空（≥ 3%）}
    - {max: 0.03, text: 无明显跳空}
    - {min: 0.03, text: 向上跳空（≥ 3%）}
  caveat: 《股市趋势技术分析》把缺口分为普通、突破、持续、衰竭四类；放量突破缺口通常不会很快回补。
close_loc:
  zh: 收盘位置
  unit: score01
  definition: （收盘 − 最低）/（最高 − 最低），收盘在当日区间中的位置。1 = 收在最高点。
  readings:
    - {max: 0.3, text: 收在日内低位（卖压占优）}
    - {max: 0.7, text: 收在日内中部}
    - {min: 0.7, text: 收在日内高位（买盘占优）}

rs_pct:
  zh: 全市场相对强度分位
  unit: score01
  definition: 0.4×3个月 + 0.3×6个月 + 0.3×12个月收益的综合值，在全部扫描股票中的百分位（仿 IBD/O'Neil 相对强度）。0.9 = 强于 90% 的股票。
  readings:
    - {min: 0.9, text: 全市场领涨股（前 10%）}
    - {min: 0.8, text: 强势股（前 20%）}
    - {min: 0.5, text: 中上}
    - {min: 0.2, text: 中下}
    - {max: 0.2, text: 弱势股（后 20%）}
  caveat: 只对个股计算，ETF 没有此值。
sector_rs_pct:
  zh: 行业内相对强度分位
  unit: score01
  definition: 同一 GICS 行业内的相对强度百分位。
  readings:
    - {min: 0.85, text: 行业龙头（前 15%）}
    - {min: 0.5, text: 行业中上}
    - {max: 0.5, text: 行业中下}
sector_rel_20:
  zh: 所属行业 20 日相对 SPY
  unit: pct
  definition: 所属行业 ETF 20 日涨跌 − SPY 20 日涨跌。正值表示资金在流入该行业。
  readings:
    - {min: 0.03, text: 行业明显跑赢大盘}
    - {min: 0.0, text: 行业略强于大盘}
    - {min: -0.03, text: 行业略弱于大盘}
    - {max: -0.03, text: 行业明显跑输大盘}

beta_60:
  zh: β（60 日）
  unit: beta
  definition: 近 60 日个股日收益对 SPY 日收益的回归斜率。β = 1.5 表示大盘涨跌 1% 时它平均涨跌 1.5%。
  readings:
    - {max: 0.0, text: 与大盘负相关（避险或独立行情）}
    - {max: 0.8, text: 低弹性}
    - {max: 1.3, text: 与大盘同步}
    - {min: 1.3, text: 高弹性：大盘回撤时跌得更多}
corr_60:
  zh: 与 SPY 相关性
  unit: corr
  definition: 近 60 日个股与 SPY 日收益的相关系数（−1 到 1）。
  readings:
    - {max: 0.3, text: 走势基本独立于大盘}
    - {max: 0.6, text: 与大盘中度相关}
    - {min: 0.6, text: 高度跟随大盘}
market_ret_1d:
  zh: 今日大盘贡献
  unit: pct
  definition: 前一日的 β（60 日）× SPY 今日涨跌，即"如果它只跟着大盘走，今天应该涨跌多少"。
market_ret_20d:
  zh: 20 日大盘贡献
  unit: pct
  definition: 近 20 日每日"大盘贡献"（β × SPY 涨跌）的累计；与"20 日个股自身"相加约等于这 20 日的涨跌（按日累加口径）。
idio_ret_1d:
  zh: 今日个股自身
  unit: pct
  definition: 今日涨跌 − 今日大盘贡献，扣掉大盘之后个股自己的走势。
  readings:
    - {max: -0.03, text: 个股自身明显走弱（−3% 以上）}
    - {max: 0.03, text: 个股自身变化不大}
    - {min: 0.03, text: 个股自身明显走强（+3% 以上）}
idio_ret_5d:
  zh: 5 日个股自身
  unit: pct
  definition: 近 5 日每日"个股自身"部分的累计。
idio_ret_20d:
  zh: 20 日个股自身
  unit: pct
  definition: 近 20 日每日"个股自身"部分的累计，衡量这一个月里有多少涨跌来自公司本身而不是大盘。
  readings:
    - {max: -0.10, text: 一个月内个股自身大幅跑输（−10% 以上）}
    - {max: 0.10, text: 一个月内大致跟随大盘}
    - {min: 0.10, text: 一个月内个股自身大幅跑赢（+10% 以上）}

zscore_20:
  zh: z 分数（20 日）
  unit: sigma
  definition: （收盘 − 20 日均线）/ 20 日收盘标准差，偏离均值多少个标准差。
  readings:
    - {max: -2.0, text: 低于均值 2σ 以上，短期超跌}
    - {max: -1.0, text: 偏低}
    - {max: 1.0, text: 围绕均值}
    - {max: 2.0, text: 偏高}
    - {min: 2.0, text: 高于均值 2σ 以上，短期过热}
bb_pct:
  zh: 布林带位置 %B
  unit: score01
  definition: 收盘价在布林带（20 日均线 ± 2σ）中的位置。0 = 下轨，0.5 = 中轨，1 = 上轨；可以超出 0–1。
  readings:
    - {max: 0.0, text: 跌破布林下轨}
    - {max: 0.2, text: 贴近下轨}
    - {max: 0.8, text: 带内中部}
    - {max: 1.0, text: 贴近上轨}
    - {min: 1.0, text: 突破布林上轨}
vol_20:
  zh: 年化波动（20 日）
  unit: pct_mag
  definition: 近 20 日日收益标准差 × √252。
  readings:
    - {max: 0.20, text: 低波动（年化 ≤ 20%）}
    - {max: 0.40, text: 中等波动}
    - {max: 0.60, text: 高波动}
    - {min: 0.60, text: 极高波动（年化 ≥ 60%）}
max_dd_60:
  zh: 60 日最大回撤
  unit: pct
  definition: 近 60 日内从阶段高点到低点的最大跌幅，恒 ≤ 0。
  readings:
    - {min: -0.08, text: 回撤很小（8% 以内）}
    - {min: -0.15, text: 正常回撤}
    - {min: -0.25, text: 较大回撤}
    - {max: -0.25, text: 深度回撤（> 25%）}
vol_63:
  zh: 年化波动（63 日）
  unit: pct_mag
  definition: 近 63 个交易日日收益标准差 × √252。风险研究（ml_risk_v1，2004–2021）里它对未来 21 日波动的截面秩相关约 0.69，复杂模型没有显著超过它；仓位和风险分档都用它。
  readings:
    - {max: 0.20, text: 低波动（年化 ≤ 20%）}
    - {max: 0.35, text: 中等波动}
    - {max: 0.55, text: 高波动}
    - {min: 0.55, text: 极高波动（年化 ≥ 55%）}
vol_63_pct:
  zh: 波动分位（63 日）
  unit: score01
  definition: 63 日年化波动在当天全部流动性股票中的分位，0 = 最稳，1 = 波动最大。按五等分得到风险档位 1–5。
  readings:
    - {max: 0.2, text: 风险第 1 档（最稳的 20%）}
    - {max: 0.4, text: 风险第 2 档}
    - {max: 0.6, text: 风险第 3 档（中间）}
    - {max: 0.8, text: 风险第 4 档}
    - {min: 0.8, text: 风险第 5 档（波动最大的 20%）}
  caveat: 只说明相对风险高低。历史上第 5 档在 63 个交易日内从买入价跌破 20% 的比例约 22%（不含危机月）到 25%（全部），危机时单月可到 60% 以上；具体概率随市场环境大幅变化，不是精确预测。

# ── 价格结构（scout/structure.py，按单只股票的日线现算）──
swing_trend:
  zh: 波段结构
  unit: label
  definition: 用 5 日枢轴识别最近两个波段高点和低点。高点抬高且低点抬高 = 上升（道氏理论的趋势定义）；高点降低且低点降低 = 下降；其余 = 震荡或转换中。
swing_break:
  zh: 最新波段突破
  unit: label
  definition: 当前这段走势还没有形成确认的枢轴点。如果收盘已经跌破最近一个确认的波段低点（或突破最近波段高点），这是道氏理论里结构正在转弱（转强）的信号。它描述的是"正在发生的变化"，与"波段结构"描述的过去形态是两件事。
resistance:
  zh: 最近阻力位
  unit: price
  definition: 收盘价上方最近的一个波段高点（近一年内）。
dist_resistance:
  zh: 距阻力位
  unit: pct
  definition: 最近阻力位 / 收盘价 − 1。
  readings:
    - {max: 0.02, text: 紧贴阻力位（2% 以内），突破或受阻都在近处}
    - {max: 0.08, text: 距阻力位不远}
    - {min: 0.08, text: 上方空间较大}
support:
  zh: 最近支撑位
  unit: price
  definition: 收盘价下方最近的一个波段低点（近一年内）。
dist_support:
  zh: 距支撑位
  unit: pct
  definition: 最近支撑位 / 收盘价 − 1（负数）。
  readings:
    - {min: -0.02, text: 紧贴支撑位（2% 以内）}
    - {min: -0.08, text: 距支撑位不远}
    - {max: -0.08, text: 下方支撑较远，回撤空间较大}
updown_vol_20:
  zh: 上涨日 / 下跌日成交量比（20 日）
  unit: ratio
  definition: 近 20 日上涨日成交量之和 / 下跌日成交量之和。
  readings:
    - {max: 0.8, text: 下跌日成交更活跃（派发迹象）}
    - {max: 1.2, text: 涨跌日量能均衡}
    - {min: 1.2, text: 上涨日成交更活跃（吸筹迹象）}
  caveat: 对应《股市趋势技术分析》里"成交量跟随趋势"的原则。

# ── 规则条件里用到的辅助字段（不进每日快照，只在扫描时计算）──
open:
  zh: 开盘价
  unit: price
  definition: 当日开盘价（复权）。
low:
  zh: 最低价
  unit: price
  definition: 当日最低价（复权）。
high_55_prior:
  zh: 前 55 日最高价
  unit: price
  definition: 不含当日的前 55 个交易日最高价；收盘高于它即为 55 日新高突破（海龟交易法的经典通道）。
high_20:
  zh: 20 日最高价
  unit: price
  definition: 近 20 日最高价，强势回调的第一目标位。
low_5:
  zh: 5 日最低价
  unit: price
  definition: 近 5 日最低价，回调类规则的止损参照。
atr_pct_prev:
  zh: 前日 ATR%
  unit: pct_mag
  definition: 前一交易日的 ATR(14) / 收盘价，用于判断今日跳空或涨幅相对正常波动有多大。
sector_rel_20_prev5:
  zh: 5 天前的行业 20 日相对 SPY
  unit: pct
  definition: 5 个交易日前，所属行业 ETF 20 日涨跌 − SPY 20 日涨跌；与今天对比可看出行业是否刚刚由弱转强。
sector_rel_63:
  zh: 行业 3 个月相对 SPY
  unit: pct
  definition: 所属行业 ETF 63 日涨跌 − SPY 63 日涨跌。

# ── 板块指标（scout/sectors.py，按板块成分股或板块 ETF 计算）──
rel_20:
  zh: 20 日相对 SPY
  unit: pct
  definition: 板块 ETF 20 日涨跌 − SPY 20 日涨跌。
  readings:
    - {min: 0.05, text: 明显跑赢大盘}
    - {min: 0.0, text: 略强于大盘}
    - {min: -0.05, text: 略弱于大盘}
    - {max: -0.05, text: 明显跑输大盘}
rs_ratio:
  zh: 相对强度比
  unit: score100
  definition: （板块 ETF / SPY）÷ 其 50 日均值 × 100。大于 100 表示跑赢自身的相对趋势（RRG 横轴，开放近似）。
rs_momentum:
  zh: 相对强度动量
  unit: score100
  definition: 相对强度比 ÷ 10 日前的相对强度比 × 100。大于 100 表示相对强度在加速（RRG 纵轴，开放近似）。
quadrant:
  zh: 轮动象限
  unit: label
  definition: 领先（比 ≥100、动量 ≥100）→ 转弱（比 ≥100、动量 <100）→ 落后（都 <100）→ 改善（比 <100、动量 ≥100），通常按顺时针轮动。
pct_above_50:
  zh: 站上 50 日线比例
  unit: score01
  definition: 板块内流动性足够的成分股中，收盘在 50 日均线上方的比例（市场宽度）。
  readings:
    - {min: 0.7, text: 普涨，宽度强}
    - {min: 0.5, text: 多数个股健康}
    - {min: 0.3, text: 分化，少数个股支撑}
    - {max: 0.3, text: 普跌，宽度弱}
pct_above_200:
  zh: 站上 200 日线比例
  unit: score01
  definition: 板块内成分股收盘在 200 日均线上方的比例，衡量长期健康度。
net_new_highs:
  zh: 20 日净新高比例
  unit: pct
  definition: （创 20 日新高的成分股数 − 创 20 日新低的成分股数）/ 成分股数。
  readings:
    - {min: 0.15, text: 新高显著多于新低}
    - {min: -0.15, text: 新高新低大致均衡}
    - {max: -0.15, text: 新低显著多于新高}
cmf_20:
  zh: 资金流 CMF（20 日）
  unit: signed
  definition: Chaikin Money Flow：按收盘在日内区间的位置给成交量加权（收在高位记为流入），板块成分股取平均。−1 到 1。这是基于日线的代理指标，不是真实的买卖单。
  readings:
    - {min: 0.10, text: 资金明显流入（吸筹）}
    - {min: 0.0, text: 略偏流入}
    - {min: -0.10, text: 略偏流出}
    - {max: -0.10, text: 资金明显流出（派发）}
rel_dollar_vol:
  zh: 成交额热度
  unit: ratio
  definition: 板块近 5 日日均成交额 / 近 60 日日均成交额。大于 1 表示关注度在上升。
  readings:
    - {min: 1.2, text: 成交明显放大，关注度上升}
    - {min: 0.9, text: 成交正常}
    - {max: 0.9, text: 成交萎缩，关注度下降}
dollar_vol_share:
  zh: 成交额占比
  unit: score01
  definition: 近 5 日该板块成交额占全部板块成交额的比例。
heat:
  zh: 热度
  unit: score01
  definition: 板块之间按 20 日相对 SPY、相对强度比、相对强度动量、站上 50 日线比例、涨跌日量比、成交额热度分别排名，取百分位的平均。≥ 0.67 为热，≤ 0.33 为冷。
news_attention:
  zh: 新闻关注度
  unit: ratio
  definition: 最近 7 天该板块的新闻条数 ÷ 之前 7 天的条数（只统计两段都有覆盖的标的，去重后计）。大于 1 表示关注度上升。基线不足时不计算。
  readings:
    - {min: 1.5, text: 新闻关注度明显上升}
    - {min: 0.8, text: 关注度正常}
    - {max: 0.8, text: 关注度下降}
tone_net:
  zh: 新闻情绪净值
  unit: signed
  definition: 最近 3 天（正面条数 − 负面条数）÷ 总条数，情绪由新闻摘要模型标注。
  readings:
    - {min: 0.2, text: 新闻偏正面}
    - {min: -0.2, text: 新闻中性}
    - {max: -0.2, text: 新闻偏负面}

# ── 异常事件（scout/events.py）：最近 60 个交易日里最显著的一次异动 ──
event_ret:
  zh: 异动日涨跌
  unit: pct
  definition: 异动当天的收盘涨跌。异动 = 个股自身部分 ≥ 事前 60 日个股自身波动的 3 倍标准差（且涨跌 ≥ 4%），或涨跌 ≥ 8%，或量能 ≥ 3 倍且涨跌 ≥ 3%。
event_idio:
  zh: 异动日个股自身
  unit: pct
  definition: 异动当天扣除大盘贡献（β × SPY）之后的个股自身涨跌。
event_sigma:
  zh: 异动幅度（标准差倍数）
  unit: sigma
  definition: 异动日个股自身涨跌 ÷ 事前 60 个交易日个股自身日波动的标准差。用事前分布衡量，避免事件本身把波动抬高。
  readings:
    - {max: -4, text: 极端下跌（−4σ 以上，罕见）}
    - {max: -3, text: 显著异常下跌（−3σ 以上）}
    - {max: 3, text: 幅度在常见范围内（主要因成交量或绝对涨跌入选）}
    - {max: 4, text: 显著异常上涨（+3σ 以上）}
    - {min: 4, text: 极端上涨（+4σ 以上，罕见）}
event_gap:
  zh: 异动日开盘跳空
  unit: pct
  definition: 异动日开盘价 / 前一日收盘价 − 1。跳空占主导说明消息在盘前或隔夜发布。
event_intraday:
  zh: 异动日盘中涨跌
  unit: pct
  definition: 异动日收盘价 / 开盘价 − 1。盘中占主导说明消息在交易时段内发布或逐步发酵。
event_vol_ratio:
  zh: 异动日量比
  unit: ratio
  definition: 异动日成交量 ÷ 此前 50 日平均成交量。
  readings:
    - {min: 3, text: 剧烈放量（≥ 3 倍），有新信息或大资金进出}
    - {min: 1.5, text: 明显放量}
    - {max: 1.5, text: 量能一般}
event_sector_ret:
  zh: 异动日所属板块涨跌
  unit: pct
  definition: 异动当天所属行业 ETF 的涨跌，用来区分个股事件和板块行情。
event_after_ret:
  zh: 异动后至今涨跌
  unit: pct
  definition: 异动日收盘到最近收盘的涨跌，看事件后是延续还是修复。
event_sessions_ago:
  zh: 距异动交易日数
  unit: count
  definition: 异动日距最近一个交易日相隔的交易日数（0 = 最近一个交易日）。
event_fwd20_median:
  zh: 同类异动后 20 日超额中位数
  unit: pct
  definition: Scout 回放：全市场同方向、同时段（跳空/盘中）、同趋势位置的异动之后 20 个交易日相对 SPY 的超额收益中位数（含幸存者偏差）。
event_fwd20_up_share:
  zh: 同类异动后 20 日跑赢 SPY 比例
  unit: score01
  definition: 同类异动之后 20 个交易日跑赢 SPY 的比例；接近 50% 说明方向没有统计上的倾向。
event_fwd_n:
  zh: 同类异动样本数
  unit: count
  definition: 回放中同类异动的次数。

# ── 基本面与预期（scout/fundamentals.py，Finnhub 免费数据，按日缓存）──
market_cap:
  zh: 市值
  unit: usd
  definition: 总市值（美元）。
pe_ttm:
  zh: 市盈率（TTM）
  unit: ratio
  definition: 股价 ÷ 过去 12 个月每股收益。盈利很小或为负时没有可比性。
  readings:
    - {max: 0, text: 亏损，市盈率不适用}
    - {max: 15, text: 估值偏低}
    - {max: 30, text: 估值中等}
    - {max: 60, text: 估值偏高}
    - {min: 60, text: 估值很高（市场定价未来增长，预期落空时回撤大）}
ps_ttm:
  zh: 市销率（TTM）
  unit: ratio
  definition: 市值 ÷ 过去 12 个月营收。
  readings:
    - {max: 3, text: 市销率偏低}
    - {max: 10, text: 市销率中等}
    - {min: 10, text: 市销率很高（高增长或高毛利预期）}
pb_ratio:
  zh: 市净率
  unit: ratio
  definition: 市值 ÷ 最近季度净资产。
rev_growth_ttm:
  zh: 营收增速（TTM 同比）
  unit: pct
  definition: 过去 12 个月营收相对上一个 12 个月的增长。
  readings:
    - {max: 0, text: 营收下滑}
    - {max: 0.10, text: 低速增长}
    - {max: 0.25, text: 中速增长}
    - {min: 0.25, text: 高速增长（≥ 25%）}
rev_growth_q:
  zh: 营收增速（最近季度同比）
  unit: pct
  definition: 最近一个季度营收相对去年同季的增长，比 TTM 更能反映最新趋势。
eps_growth_ttm:
  zh: 每股收益增速（TTM 同比）
  unit: pct
  definition: 过去 12 个月每股收益相对上一个 12 个月的变化。
gross_margin:
  zh: 毛利率（TTM）
  unit: pct_mag
  definition: 毛利 ÷ 营收。
op_margin:
  zh: 营业利润率（TTM）
  unit: pct
  definition: 营业利润 ÷ 营收，反映扣除研发和销售费用后的经营盈利能力。
  readings:
    - {max: 0, text: 经营亏损}
    - {max: 0.10, text: 经营利润率偏低}
    - {max: 0.25, text: 经营利润率中等}
    - {min: 0.25, text: 经营利润率高}
net_margin:
  zh: 净利率（TTM）
  unit: pct
  definition: 净利润 ÷ 营收。
roe_ttm:
  zh: 净资产收益率（TTM）
  unit: pct
  definition: 净利润 ÷ 平均净资产。
current_ratio:
  zh: 流动比率
  unit: ratio
  definition: 流动资产 ÷ 流动负债；低于 1 说明短期偿债压力较大。
  readings:
    - {max: 1, text: 短期偿债压力较大}
    - {max: 2, text: 短期偿债能力正常}
    - {min: 2, text: 现金和流动资产充裕}
debt_equity:
  zh: 负债权益比
  unit: ratio
  definition: 总负债 ÷ 股东权益（最近季度）。
  readings:
    - {max: 0.3, text: 负债很低}
    - {max: 1, text: 负债适中}
    - {min: 1, text: 杠杆较高}
analyst_buy_share:
  zh: 分析师买入评级占比
  unit: score01
  definition: 最近一个月覆盖分析师中"买入 + 强烈买入"的比例（Finnhub 汇总）。
  readings:
    - {min: 0.7, text: 分析师普遍看多}
    - {min: 0.4, text: 分析师观点分歧}
    - {max: 0.4, text: 分析师偏谨慎}
analyst_buy_change:
  zh: 买入占比三个月变化
  unit: pp
  definition: 买入评级占比与三个月前相比的变化（百分点），反映评级是在上调还是下调。
  readings:
    - {max: -0.1, text: 评级明显下调}
    - {max: 0.1, text: 评级基本稳定}
    - {min: 0.1, text: 评级明显上调}
analyst_count:
  zh: 覆盖分析师数
  unit: count
  definition: 最近一个月给出评级的分析师人数。
eps_beat_count:
  zh: 近 4 季超预期次数
  unit: count
  definition: 最近 4 个季度中实际每股收益高于一致预期的次数。
eps_quarters:
  zh: 可比季度数
  unit: count
  definition: 有实际值和预期值的季度数（最多 4）。
eps_surprise_last:
  zh: 最近一季 EPS 超预期幅度
  unit: pct
  definition: （实际 − 预期）÷ |预期|。预期接近 0 时不计算。
insider_net_value_90d:
  zh: 内部人 90 日净买卖额
  unit: usd
  definition: 最近 90 天内部人在公开市场的买入额 − 卖出额（只计 P/S 交易，不含授予和行权）。许多卖出是预先计划（10b5-1）的，单笔卖出信息量有限，集中买入更值得注意。
insider_buyers_90d:
  zh: 内部人买入人数（90 日）
  unit: count
  definition: 最近 90 天在公开市场买入的内部人人数。
insider_sellers_90d:
  zh: 内部人卖出人数（90 日）
  unit: count
  definition: 最近 90 天在公开市场卖出的内部人人数。

# ── v2 第 3 阶段：基本面趋势（SEC EDGAR 季度财报，按申报日期取当时已知的数据）──
fin_period:
  zh: 最近财报期
  unit: text
  definition: 最近一份已申报财报的期末日期；外国公司多为年度数据。
fin_rev_yoy:
  zh: 最近一季营收同比
  unit: pct
  definition: 最近一个季度营收相对去年同季的增长（年度申报公司为年度同比）。
  readings:
    - {max: -0.05, text: 营收明显下滑}
    - {max: 0.05, text: 营收基本持平}
    - {max: 0.20, text: 营收稳健增长}
    - {min: 0.20, text: 营收高速增长（≥ 20%）}
fin_rev_accel:
  zh: 营收增速变化
  unit: pp
  definition: 最近一季的营收同比增速 − 上一季的同比增速。正值 = 增长在加速，负值 = 在放缓。
  readings:
    - {max: -0.05, text: 增速明显放缓}
    - {max: 0.05, text: 增速大致稳定}
    - {min: 0.05, text: 增速明显加快}
fin_gross_margin:
  zh: 最近一季毛利率
  unit: pct_mag
  definition: 毛利 ÷ 营收（没有毛利科目时用营收 − 营业成本）。
fin_gross_margin_chg:
  zh: 毛利率同比变化
  unit: pp
  definition: 最近一季毛利率 − 去年同季毛利率（百分点）。
  readings:
    - {max: -0.02, text: 毛利率明显下降（定价权或成本承压）}
    - {max: 0.02, text: 毛利率稳定}
    - {min: 0.02, text: 毛利率明显提升}
fin_op_margin:
  zh: 最近一季营业利润率
  unit: pct
  definition: 营业利润 ÷ 营收。
  readings:
    - {max: 0, text: 经营亏损}
    - {max: 0.10, text: 营业利润率偏低}
    - {max: 0.25, text: 营业利润率中等}
    - {min: 0.25, text: 营业利润率高}
fin_op_margin_chg:
  zh: 营业利润率同比变化
  unit: pp
  definition: 最近一季营业利润率 − 去年同季（百分点），反映经营杠杆是在释放还是在收缩。
  readings:
    - {max: -0.03, text: 利润率明显收缩}
    - {max: 0.03, text: 利润率大致稳定}
    - {min: 0.03, text: 利润率明显扩张（经营杠杆释放）}
fin_fcf_ttm:
  zh: 自由现金流（近 4 季）
  unit: usd
  definition: 近 4 个季度经营现金流 − 资本开支之和（只对美元报表计算）。
fin_fcf_margin:
  zh: 自由现金流率
  unit: pct
  definition: 近 4 季自由现金流 ÷ 近 4 季营收。
  readings:
    - {max: 0, text: 在消耗现金}
    - {max: 0.10, text: 现金创造一般}
    - {min: 0.10, text: 现金创造能力强}
fin_net_cash:
  zh: 净现金
  unit: usd
  definition: 现金及短期投资 − 长期和短期有息负债（最近一个资产负债表日）；负数为净负债。
fin_share_change:
  zh: 稀释股本一年变化
  unit: pct
  definition: 最近一季稀释后加权股数相对一年前的变化。正值 = 股本稀释（增发、股权激励），负值 = 回购。
  readings:
    - {max: -0.02, text: 持续回购}
    - {max: 0.02, text: 股本基本稳定}
    - {min: 0.02, text: 股本明显稀释}
fin_quarters:
  zh: 季度财报数量
  unit: count
  definition: 可用于计算的季度数量。

# ── 估值位置 ──
val_pe_ttm:
  zh: 市盈率（近 4 季）
  unit: ratio
  definition: 股价 ÷ 近 4 季稀释每股收益之和（外国公司用 Yahoo 的 trailing PE）。盈利为负时不计算。
  readings:
    - {max: 15, text: 估值偏低}
    - {max: 30, text: 估值中等}
    - {max: 60, text: 估值偏高}
    - {min: 60, text: 估值很高}
val_fwd_pe:
  zh: 预期市盈率
  unit: ratio
  definition: 股价 ÷ 未来 12 个月一致预期每股收益（Yahoo）。
val_ps_ttm:
  zh: 市销率（近 4 季）
  unit: ratio
  definition: 股价 × 稀释股数 ÷ 近 4 季营收。
val_pfcf:
  zh: 市值 / 自由现金流
  unit: ratio
  definition: 市值 ÷ 近 4 季自由现金流（自由现金流为正时）。
val_ev_ebitda:
  zh: EV / EBITDA
  unit: ratio
  definition: 企业价值 ÷ 近 12 个月 EBITDA（Yahoo）。
val_ev_sales:
  zh: EV / 营收
  unit: ratio
  definition: 企业价值 ÷ 近 12 个月营收（Yahoo）。
val_ps_pctile:
  zh: 市销率历史分位
  unit: score01
  definition: 当前市销率在过去约 3 年各季末市销率中的分位（0 = 最便宜，100% = 最贵）。
  readings:
    - {min: 0.8, text: 处于自身历史高位}
    - {min: 0.2, text: 处于自身历史中间区域}
    - {max: 0.2, text: 处于自身历史低位}
val_ps_hist_n:
  zh: 市销率历史样本数
  unit: count
  definition: 计算历史分位用到的季末数量。
val_ev_sales_vs_sector:
  zh: EV/营收相对同行
  unit: ratio
  definition: 本公司 EV/营收 ÷ 研究池内同行业公司的中位数。1 = 与同行相当。
  readings:
    - {min: 1.5, text: 明显贵于同行}
    - {min: 0.67, text: 与同行相当}
    - {max: 0.67, text: 明显便宜于同行}
val_fwd_pe_vs_sector:
  zh: 预期市盈率相对同行
  unit: ratio
  definition: 本公司预期市盈率 ÷ 研究池内同行业公司的中位数。
  readings:
    - {min: 1.5, text: 明显贵于同行}
    - {min: 0.67, text: 与同行相当}
    - {max: 0.67, text: 明显便宜于同行}

# ── 预期与修正（Yahoo 一致预期，每日快照）──
est_eps_rev_30d:
  zh: 本财年 EPS 预期 30 日修正
  unit: pct
  definition: 本财年一致预期每股收益相对 30 天前的变化。上调说明分析师在追认好消息。
  readings:
    - {max: -0.03, text: 预期明显下调}
    - {max: 0.03, text: 预期基本稳定}
    - {min: 0.03, text: 预期明显上调}
est_eps_rev_90d:
  zh: 本财年 EPS 预期 90 日修正
  unit: pct
  definition: 本财年一致预期每股收益相对 90 天前的变化。
  readings:
    - {max: -0.05, text: 一个季度内预期明显下调}
    - {max: 0.05, text: 预期基本稳定}
    - {min: 0.05, text: 一个季度内预期明显上调}
est_up_30d:
  zh: 30 日上调预期人数
  unit: count
  definition: 过去 30 天上调本财年 EPS 预期的分析师人数。
est_down_30d:
  zh: 30 日下调预期人数
  unit: count
  definition: 过去 30 天下调本财年 EPS 预期的分析师人数。
est_analysts:
  zh: 覆盖分析师（预期）
  unit: count
  definition: 给出本财年 EPS 预期的分析师人数。
est_eps_growth_next:
  zh: 下一财年 EPS 预期增长
  unit: pct
  definition: 下一财年一致预期 EPS ÷ 本财年一致预期 EPS − 1。
est_target_upside:
  zh: 目标价均值空间
  unit: pct
  definition: 分析师目标价均值 ÷ 当前股价 − 1。目标价普遍滞后于价格，大幅下跌后空间会被动放大。
est_target_dispersion:
  zh: 目标价分歧度
  unit: pct_mag
  definition: （最高目标价 − 最低目标价）÷ 目标价均值。越大说明分析师观点越分散。
  readings:
    - {min: 1.0, text: 分歧极大}
    - {min: 0.5, text: 分歧较大}
    - {max: 0.5, text: 观点较集中}
est_upgrades_30d:
  zh: 30 日评级上调次数
  unit: count
  definition: 过去 30 天评级上调的机构数（Yahoo 评级变动明细）。
est_downgrades_30d:
  zh: 30 日评级下调次数
  unit: count
  definition: 过去 30 天评级下调的机构数。
est_pt_raises_30d:
  zh: 30 日上调目标价次数
  unit: count
  definition: 过去 30 天上调目标价的次数。
est_pt_cuts_30d:
  zh: 30 日下调目标价次数
  unit: count
  definition: 过去 30 天下调目标价的次数。

# ── 财报事件 ──
earn_days_since:
  zh: 距上次财报天数
  unit: count
  definition: 最近一次财报发布距今的自然日数。
earn_days_to_next:
  zh: 距下次财报天数
  unit: count
  definition: 距下一次财报发布的自然日数。
earn_eps_surprise:
  zh: 上次财报 EPS 超预期
  unit: pct
  definition: （实际 EPS − 预期 EPS）÷ |预期 EPS|。
earn_rev_surprise:
  zh: 上次财报营收超预期
  unit: pct
  definition: （实际营收 − 预期营收）÷ 预期营收。
earn_last_move:
  zh: 上次财报股价反应
  unit: pct
  definition: 财报前一交易日收盘到财报后第一个交易日收盘的涨跌（按 SEC 8-K 2.02 发布日）。
earn_avg_abs_move:
  zh: 历次财报平均波动
  unit: pct_mag
  definition: 最近（最多 8 次）财报前后收盘涨跌幅绝对值的平均。
earn_reactions_n:
  zh: 财报样本数
  unit: count
  definition: 计算平均财报波动用到的次数。
earn_implied_vs_hist:
  zh: 期权预期 / 历史财报波动
  unit: ratio
  definition: 下次财报落在最近到期月内时，跨式期权隐含的涨跌幅 ÷ 历次财报平均波动。> 1 说明期权把这次财报定价得比历史更剧烈。
  readings:
    - {min: 1.3, text: 期权预期的财报波动明显高于历史}
    - {min: 0.8, text: 期权预期与历史财报波动相当}
    - {max: 0.8, text: 期权预期低于历史财报波动（可能低估）}

# ── 持仓与资金（Yahoo 持仓 / 做空快照 + Finnhub 内部人）──
own_inst_pct:
  zh: 机构持股比例
  unit: score01
  definition: 机构投资者持有的流通股比例（13F 汇总，按季更新）。
own_insider_pct:
  zh: 内部人持股比例
  unit: score01
  definition: 公司内部人持有的股份比例。
own_short_float:
  zh: 做空占流通股比例
  unit: pct_mag
  definition: 未平仓空头股数 ÷ 流通股（FINRA，约每两周更新）。
  readings:
    - {min: 0.15, text: 做空比例很高（≥ 15%），有轧空可能，也说明分歧大}
    - {min: 0.05, text: 做空比例中等}
    - {max: 0.05, text: 做空比例低}
own_short_days:
  zh: 空头回补天数
  unit: days
  definition: 空头股数 ÷ 日均成交量，空头全部回补大约需要的交易日数。
  readings:
    - {min: 5, text: 回补需要 5 天以上，空头拥挤}
    - {max: 5, text: 回补压力不大}
own_short_change:
  zh: 空头股数月度变化
  unit: pct
  definition: 最新空头股数相对上一期的变化。
own_top_holder_change:
  zh: 前十大机构持仓变化
  unit: pct
  definition: 前十大机构最近一期 13F 持股数变化的平均值。
  readings:
    - {max: -0.05, text: 大机构在减持}
    - {max: 0.05, text: 大机构持仓稳定}
    - {min: 0.05, text: 大机构在增持}

# ── 期权市场的预期（每日 15:30–16:00 美东快照，Black-Scholes 自算隐含波动）──
opt_iv_front:
  zh: 近月平值隐含波动
  unit: pct_mag
  definition: 最近一个（≥ 7 天）到期日平值期权的隐含波动率（年化）。
opt_iv_30:
  zh: 30 天平值隐含波动
  unit: pct_mag
  definition: 约 30 天到期的平值期权隐含波动率（年化）。
opt_iv_rv_ratio:
  zh: 隐含 / 实际波动
  unit: ratio
  definition: 30 天隐含波动 ÷ 近 20 日实际波动（年化）。> 1 说明期权市场预期未来比过去更动荡（常见于事件前）。
  readings:
    - {min: 1.5, text: 期权市场预期波动明显上升（事件或恐慌）}
    - {min: 0.8, text: 预期波动与近期实际相当}
    - {max: 0.8, text: 期权定价低于近期实际波动}
opt_term_slope:
  zh: 期限结构斜率
  unit: pp
  definition: 远月平值隐含波动 − 近月平值隐含波动。负值（倒挂）说明市场预期近期有事件或压力。
  readings:
    - {max: -0.03, text: 期限结构倒挂（近期事件或压力）}
    - {min: -0.03, text: 期限结构正常}
opt_move_front:
  zh: 近月跨式隐含涨跌幅
  unit: pct_mag
  definition: 近月平值看涨 + 看跌期权中间价 ÷ 股价，近似期权市场预期到期前的涨跌幅度。
opt_put_skew:
  zh: 看跌偏斜
  unit: pp
  definition: 10% 虚值看跌期权的隐含波动 − 平值隐含波动。越高说明市场越愿意为下跌保护付钱。
  readings:
    - {min: 0.10, text: 下跌保护需求很强}
    - {min: 0.03, text: 正常的看跌偏斜}
    - {max: 0.03, text: 看跌偏斜很低（市场不担心下跌）}
opt_pc_volume:
  zh: 看跌 / 看涨成交量比
  unit: num
  definition: 当日看跌期权总成交量 ÷ 看涨期权总成交量（最近几个到期日）。
  readings:
    - {min: 1.5, text: 看跌成交明显偏多}
    - {min: 0.5, text: 看跌看涨大致均衡}
    - {max: 0.5, text: 看涨成交明显偏多}
opt_unusual_count:
  zh: 异常成交合约数
  unit: count
  definition: 当日成交量 ≥ 500 且 ≥ 2 倍昨日持仓量的合约数（新开仓的大量交易）。免费数据看不出买卖方向。
opt_iv_history_days:
  zh: 隐含波动历史天数
  unit: count
  definition: 已积累的每日期权快照天数；达到 60 天后才计算隐含波动历史分位。
opt_iv_rank:
  zh: 隐含波动历史分位
  unit: score01
  definition: 今日 30 天隐含波动在已积累历史中的分位。
  readings:
    - {min: 0.8, text: 期权处于历史较贵的位置}
    - {min: 0.2, text: 期权价格处于历史中间}
    - {max: 0.2, text: 期权处于历史较便宜的位置}

# ── 宏观敏感度（近 252 个交易日回归：个股日收益 ~ SPY + 10 年期收益率变化 + 美元 + 原油）──
macro_rate_10bp:
  zh: 利率敏感度（每 +10bp）
  unit: pct2
  definition: 控制大盘后，10 年期美债收益率每上升 0.10 个百分点，个股平均额外涨跌。负值 = 怕加息/利率上行。
macro_rate_t:
  zh: 利率敏感度 t 值
  unit: num
  definition: 利率敏感度的 t 统计量；绝对值 ≥ 2 才算统计上显著。
  readings:
    - {max: -2, text: 显著（负向）}
    - {max: 2, text: 不显著}
    - {min: 2, text: 显著（正向）}
macro_usd_1pct:
  zh: 美元敏感度（每 +1%）
  unit: pct2
  definition: 控制大盘后，美元指数每上涨 1%，个股平均额外涨跌。海外收入占比高的公司通常为负。
macro_usd_t:
  zh: 美元敏感度 t 值
  unit: num
  definition: 美元敏感度的 t 统计量；绝对值 ≥ 2 才算显著。
  readings:
    - {max: -2, text: 显著（负向）}
    - {max: 2, text: 不显著}
    - {min: 2, text: 显著（正向）}
macro_oil_10pct:
  zh: 油价敏感度（每 +10%）
  unit: pct2
  definition: 控制大盘后，WTI 原油每上涨 10%，个股平均额外涨跌。
macro_oil_t:
  zh: 油价敏感度 t 值
  unit: num
  definition: 油价敏感度的 t 统计量；绝对值 ≥ 2 才算显著。
  readings:
    - {max: -2, text: 显著（负向）}
    - {max: 2, text: 不显著}
    - {min: 2, text: 显著（正向）}
ang_gross_profitability:
  zh: 毛利 / 总资产
  unit: pct_mag
  definition: 近四季毛利（没有毛利时用收入减营业成本）除以最新总资产，按 SEC 申报时点。毛利能力高的公司长期回报较好（Novy-Marx 2013）。
  readings:
    - {min: 0.4, text: 毛利能力很强}
    - {min: 0.2, max: 0.4, text: 毛利能力中等}
    - {max: 0.2, text: 毛利能力偏弱（或资产很重）}
ang_accruals:
  zh: 应计比例
  unit: pct
  definition: （近四季净利润 − 经营现金流）/ 平均总资产。为负说明利润有现金支撑；偏高说明利润更多来自会计估计，质量较低（Sloan 1996）。
  readings:
    - {max: -0.05, text: 利润有充足现金支撑}
    - {min: -0.05, max: 0.05, text: 利润与现金流大致匹配}
    - {min: 0.05, text: 利润明显高于现金流，质量偏低}
ang_asset_growth:
  zh: 总资产同比
  unit: pct
  definition: 最新总资产相对一年前的变化。资产扩张过快的公司随后往往表现偏弱（Cooper、Gulen、Schill 2008），常见于大额并购或融资扩张。
  readings:
    - {min: 0.3, text: 资产扩张很快（并购或大额融资？）}
    - {max: 0.3, text: 资产增长正常}
ang_net_issuance:
  zh: 股本同比
  unit: pct
  definition: 稀释后股本相对一年前的变化。为负 = 净回购；为正 = 增发或股权激励稀释（Pontiff、Woodgate 2008）。
  readings:
    - {max: -0.02, text: 净回购}
    - {min: -0.02, max: 0.02, text: 股本基本不变}
    - {min: 0.02, text: 股本稀释}
ang_revenue_growth:
  zh: 收入同比（SEC）
  unit: pct
  definition: 最近一季收入相对去年同季的变化，按 SEC 申报时点。
ang_ear:
  zh: 财报公告反应
  unit: pct
  definition: 最近一次财报（SEC 8-K 2.02 项）申报日前后 3 个交易日的涨跌减去 SPY 同期涨跌。公告反应会在之后继续同向漂移，是文献里较稳定的规律之一（Brandt 等 2008），Scout 的检验结果见知识库。
ang_ear_sessions_ago:
  zh: 距最近财报公告（交易日）
  unit: count
  definition: 最近一次财报公告反应窗口结束后过了多少个交易日。
ang_insider_officer_buyers:
  zh: 高管 / 董事买入人数（SEC，90 日）
  unit: count
  definition: 最近 90 天在公开市场买入本公司普通股的高管和董事人数（SEC Form 4，剔除 10b5-1 计划交易）。两人以上集中买入的信息含量较高（Lakonishok、Lee 2001）。数据来自 SEC 季度数据集，最新一个季度在季度结束后才发布，见 ang_insider_data_through。
ang_insider_data_through:
  zh: 内部人数据截至
  unit: text
  definition: SEC 内部人季度数据覆盖到的最后申报日期；之后的买入还没有计入。
