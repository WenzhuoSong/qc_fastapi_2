# Seed entries of the knowledge base (scout.knowledge). Loaded once per key:
# an entry already in the database is never overwritten from here; later
# changes are new versions written through scout.learned.
#
# Fields: see scout/learned.py. Numbers in `summary` come from the stored
# study briefs named in `source`; copy them, never round them by hand.

- key: breakout_retest_selection
  kind: rule
  polarity: positive
  status: backtested
  title: 突破回踩：选出的股票跑赢同日随机股票
  claim: 收盘突破 55 日高点后不追价、等 10 个交易日内回踩突破位再入场，这些股票在同样的止损止盈下跑赢同一天随机选的股票，前后两半都成立。
  mechanism: 突破说明有新的需求；回踩不破说明突破位从阻力变成支撑，短线获利盘已经离场。与"趋势突破"同一个触发条件，追价没有优势而等回踩有，说明优势在入场时机和选择上，而不在突破本身。
  context: {kind: [stock], horizon_days: 20}
  applies: {detectors: [breakout_retest, trend_breakout], lenses: [support_resistance]}
  evidence:
    - source: rule_benchmarks
      date: 2026-10-28
      summary: 12 年回放 2313 笔成交；相对同日随机股票 +0.76%（t 3.78）/ +1.01%（t 3.32）（前半 / 后半），相对同股随机日期 +0.48%（t 2.15）/ +0.67%（t 1.68）；相对 SPY 只有 +0.29%（t 1.85），相对等权股票池 +0.18%（t 1.5）。
  invalidation: 前向相对同日随机股票的超额不为正，或滚动 24 个月 t < 0。
  recheck_on: 2027-04-28
  note: 回测（G1）通过；还没有预登记和前向记录，下一步进入前向检验。

- key: bracket_trade_drag
  kind: regularity
  polarity: negative
  status: rejected
  title: 区间入场 + 固定止损止盈的交易方式本身跑输大盘
  claim: 把规则的入场区间、止损和目标套在同一天随机选的股票上，结果跑输 SPY；规则选股带来的信息大部分被这种交易方式吃掉。
  mechanism: 止损在噪声里频繁触发，止盈截断了少数大涨的股票，而个股收益的分布正是靠少数大涨拉高均值。
  context: {kind: [stock]}
  applies: {topics: [entry, exit], lenses: [support_resistance]}
  evidence:
    - source: rule_benchmarks
      date: 2026-10-28
      summary: 突破回踩相对同日随机股票 +0.89%（t 4.97），相对 SPY 却只有 +0.29%（t 1.85）；强势回调相对同日随机股票 +0.40%（t 2.01），相对 SPY +0.41%（t 2.43）。
  invalidation: 换成次日开盘买入、固定持有的方式后，规则相对 SPY 的超额仍然不比现在大。
  recheck_on: 2027-04-28

- key: pullback_in_uptrend_decay
  kind: rule
  polarity: negative
  status: rejected
  title: 强势回调：优势只在前半段样本
  claim: 强势回调前半段样本跑赢同日随机股票，后半段（2021 年以后）不再显著；不能作为可靠的买入依据。
  mechanism: 上升趋势中的超短期回调（RSI(2) 低位）是广为人知的做法，可能已被套利。
  context: {kind: [stock]}
  applies: {detectors: [pullback_in_uptrend]}
  evidence:
    - source: rule_benchmarks
      date: 2026-10-28
      summary: 4808 笔成交；相对同日随机股票 +0.36%（t 2.06）/ +0.45%（t 0.35）（前半 / 后半），相对同股随机日期 +0.20%（t 1.14）/ +0.08%（t 0.91）。
  invalidation: 后续前向记录相对同日随机股票 t ≥ 3。
  recheck_on: 2027-04-28
  note: 规则仍在推送，等用户决定是否暂停。

- key: power_gap_no_edge
  kind: rule
  polarity: negative
  status: rejected
  title: 放量跳空：没有显著优势
  claim: 放量跳空相对同日随机股票和同股随机日期都没有显著超额，样本也偏少。
  context: {kind: [stock]}
