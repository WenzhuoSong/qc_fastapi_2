  status: rejected
  title: 把所有有历史的指标合起来预测 SPY 和板块下周涨跌，样本外比"平时上涨比例"更差
  claim: 价格、相对强弱、波动、资金流和涨跌日成交量比、成分股宽度、VIX、信用利差、利率曲线、季节性合在一起，用逻辑回归或 LightGBM 预测 SPY 与 SPDR 板块下周是否上涨，2005–2026 样本外都比直接用"平时约 56% 会涨"更差；模型给出的高概率周并不更常上涨，概率完全不可靠（校准斜率约 0 或为负）；只在模型看好时持有，年化约 +5% 对一直持有 +10%。
  mechanism: 周度涨跌接近随机，各指标大多是"最近跌了多少"的不同说法；模型在训练期学到的关系到下一年就不成立（甚至反过来），复杂的模型过拟合得更厉害。
  context: {kind: [etf]}
  applies: {topics: [market_risk, sector_thesis, entry]}
  evidence:
    - source: weekly_direction_v1
      date: 2026-11-06
      summary: 12333 个资产-周（2005-01 至 2026-09），下周上涨基础比例 56.1%。逻辑回归：对数损失 0.6939 vs 基础 0.6866（t -2.90，前后两半都更差），命中 54.5%；≥65% 的高置信周每资产每年 1.6 次，实际上涨 55.4% vs 54.1%；校准斜率 -0.20。LightGBM：对数损失 0.7275 vs 0.6866（t -6.39），高置信周 58.2% vs 54.4%（t 1.37）；最低预测组（29%）实际 58% 上涨，校准斜率 0.00。按模型持有：年化 +4.5% / +5.2%，夏普 0.26 / 0.33；一直持有 +10.3%，0.56。
  invalidation: 预先登记的、包含新信息（不是价格、成交量、宽度或宏观水平的组合）的周度预测在新数据上通过检验关。
  recheck_on: 2027-11-06
  note: 预登记 weekly_direction_v1，短期反转族第 6、7 次，两个模型都不通过（门槛 t ≥ 3.55）。资金流最弱组下周多涨的现象（探索中 62–66%，主要在 2013 年后）合进模型后没有带来任何样本外改善。不调参数、不换特征重算。事后诊断（同一批预测，不改判定）：比基础多亏的部分 76%（逻辑回归）/ 89%（LightGBM）可由"没有信号时概率散开"解释；反着用更差；用样本外结果事后最优重新校准也只比基础好 0.001；逐年校准斜率一半为正一半为负——不是学反，是没有稳定信号。

- key: weekly_up_v2
  kind: method
  polarity: negative
  status: rejected
  title: 69 个专业化特征 + 交叉验证的模型，判断"下周会涨"仍达不到稳定 60%；简单的"资金流最弱"规则反而更好，但属于事后发现
  claim: 按波动标准化的多期限趋势、扣贝塔的残差强弱、多种波动、成交量与资金流、成分股宽度、市场分化与相关、VIX 期限结构、信用、利率、原油、美元、月初与 FOMC 周等 69 个特征，用时间序列交叉验证选择正则强度（不如基础比例就不表态），判断 SPY 与板块"下周会涨"：LightGBM 准确率 60.2%（基础 54.2%），但每个资产每年只有 2.2 次、后半段只有 107 次，t 0.94；逻辑回归与平均模型几乎不表态或低于基础比例；全部周的概率仍略差于基础比例。
  mechanism: 交叉验证在多数年份只留下很少的树或很强的正则——数据里几乎没有稳定可学的周度信息；少数表态集中在个别年份（2009、2010、2013），不稳定。
  context: {kind: [etf]}
  applies: {topics: [market_risk, sector_thesis, entry]}
  evidence:
    - source: weekly_up_v2
      date: 2026-11-06
      summary: 样本外 2007-01 至 2026-09，11293 个资产-周，基础上涨比例 56.1%。M1：87 次，46.0% vs 55.1%，5/20 年不表态。M2：477 次，60.2% vs 54.2%（+6.0 个百分点，t 0.94；前 59.2% / 后 63.6%，后半 107 次），每资产每年 2.2 次，对数损失 0.6883 vs 0.6864。M3：63 次，55.6%。对照规则（只报告）：站上 200 日线 56.5% vs 54.6%；资金流 CMF 处于自身 5 年最低五分之一 62.0% vs 54.7%（2254 次，t 2.47，前 59.9% / 后 63.6%）；目标周含月初 57.1% vs 54.6%。
  invalidation: 资金流最低五分之一的规则在前向记录中（2026-11 之后的新数据）达到 ≥ 60% 且显著高于基础比例。
  recheck_on: 2027-11-06
  note: 预登记 weekly_up_v2，短期反转族第 8–10 次，三个模型都不通过（门槛：准确率前后两半 ≥ 60%、t ≥ 3.64、每资产每年 ≥ 6 次）。CMF 规则是 2026-11-05 在同一段历史上探索时看到的，不能在同一历史上再检验；只能用之后的新数据做前向记录。
