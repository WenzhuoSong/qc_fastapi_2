title: 残差动量：扣除大盘影响后的 12 个月动量 · 持仓计划卖出
claim: 按过去 12 个月（不含最近 1 个月）扣除大盘影响后的残差收益（除以其波动）排名，前 10% 的股票在随后 1 个月跑赢同一天的其他股票；在同样的 21 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 普通动量里混着大盘和风格的影响，残差动量只保留个股自身的信息；投资者对公司层面的信息反应不足，所以会延续（Blitz、Huij、Martens 2011）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。原文用 Fama-French 三因子回归，这里只用 SPY 做市场模型，可能削弱效果；动量在急速反转的行情（如 2020 年 4 月、2022 年底）会失效。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：市场模型只用 SPY（没有 Fama-French 因子数据）；只做多前 10%，不做空；股票池是当前指数成分股中流动性足够的股票。
