# Pre-registration of the redeployment study, written 2026-10-29 before any run.
# Never edited after a run; a changed design is a new file with a new key. Run once:
# `python -m scout.jobs.eval_exit_redeploy run`.
key: exit_redeploy
registered_on: '2026-10-29'
requested_by: 用户 2026-10-29："好，三项合在一起预登记并开始测"（换仓、大盘过滤、行业过滤）
question: 卖出后马上把钱换入新的目标（股票池或已通过检验的选股），并用大盘和行业形势过滤，是否比一直持有更好？

sample:
  same_as: exit_vs_hold（每 20 个交易日全池次日开盘买入；窗口 60 个交易日；同样的股票池、成本、日线成交约定）
  cost: 每笔往返 0.1%；卖出后换入再扣一次 0.1%

exits:
  plan: 现行持仓计划（与 exit_vs_hold 相同）
  atr10: 买入以来最高收盘 − 10×ATR42，收盘跌破次日开盘卖出（Wilcox）
  trail20: 买入以来最高收盘回落 20%，收盘跌破次日开盘卖出（Snorrason & Yusupov）

redeploy:
  pool: 卖出当天收盘后，钱换入股票池等权组合（当天股票池里所有股票，每天按前一天收盘的股票池等权再平衡），持有到窗口结束，不再设止损
  picks: 换入"资产增长最慢 10%"（rank_low_asset_growth，已通过回测、在前向验证）最近一次调仓（每 21 个交易日）的选股，等权，持有到窗口结束，不再设止损
  timing: 换入的收益从卖出的下一个交易日开始按收盘到收盘计算

filters:
  none: 不过滤
  market: Faber（2007）大盘过滤：SPY 月末收盘低于最近 10 个月末收盘的均值时为"避险"，直到某个月末收盘回到均值之上；避险期间（按前一天收盘时已知的状态）不开新仓（这一批的钱拿美债），换入的钱也改拿美债，已有仓位照常按卖出规则管理
  market_sector: 在 market 的基础上，换入只买所属行业走强的股票：行业 ETF（SECTOR_ETFS）近 63 个交易日收益高于 SPY（按前一天收盘），每天按前一天的状态重选；行业 ETF 历史不足 63 天时该行业算不走强；没有符合的股票时拿美债

variants: 3 种卖出 × 2 种换入 × 3 种过滤 = 18 个方案；另有 2 个基准：一直持有（hold）、一直持有 + 大盘过滤（hold_market，用来单独看大盘过滤的作用）。共 20 个，各跑一次

metrics: 与 exit_vs_hold 相同（组合年化、夏普、Sortino、最大回撤、最差 63 日，前后两半的夏普与最大回撤；逐笔均值、最差 5%、相对一直持有的差值和按月 t 值）

decision:
  candidate: 与 exit_vs_hold 相同的三条，全部满足
    - 前后两半的组合夏普都不低于一直持有
    - 全样本组合最大回撤比一直持有至少小 5 个百分点
    - 最差 5% 交易的平均亏损小于一直持有
  multiple_testing: 18 个方案里挑最好的会有运气成分；推荐的方案还要满足：逐笔相对一直持有的差值，前后两半的按月 t 值都不低于 −2（不显著落后于持有）
  pick: 满足以上全部条件的方案里，推荐全样本组合夏普最高的一个；是否改持仓计划由用户确认
  none: 都不满足时不推荐替换，结果记入知识库
  report_all: 所有 20 个方案的数字都列出，包括没通过的

simplifications: 换入组合每天按前一天的股票池、选股和行业状态再平衡，不计这部分换手成本；换入的钱不再设止损；大盘过滤只在月末更新

expected_failure: 换入股票池大致等于回到市场，卖出本身不赚不亏，多付换仓成本；资产增长选股的超额每季度约 0.9%，换入时间平均只有一个多月，增益有限；大盘过滤在 2015–2026 年的牛市里多次误报（例如 2015–2016、2018 年底、2020 年 3 月、2022 年），可能降低收益；行业动量在本样本中没有通过检验（板块轮动规则被否定）。
