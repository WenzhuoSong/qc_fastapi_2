title: 净回购：股本减少最多的公司 · 持仓计划卖出
claim: 按稀释后股本同比排名，股本减少最多（净回购最多）的 10% 在随后一个季度跑赢同一天的其他股票；在同样的 63 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 管理层在股价被低估时回购、被高估时增发，市场对这一信号反应不足（Pontiff、Woodgate 2008）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。大盘股普遍回购，信号区分度可能不高；回购也可能只是在抵消股权激励。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：用稀释后股本代替流通股本；每 21 个交易日重排一次，持有 63 个交易日；只做多最低的 10%。
registered_on: '2026-10-28'
registration_note: 2026-10-28 用户要求：所有已否定的策略按持仓计划的卖出规则各重测一次。选股/入场条件、持有窗口与原规格相同，只换卖出规则；对照股票用同样的卖出规则。计入原族的检验次数。
