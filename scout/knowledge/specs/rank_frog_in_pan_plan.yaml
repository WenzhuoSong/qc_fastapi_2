title: 平滑动量（"温水煮青蛙"）：由很多小涨日积累的动量 · 持仓计划卖出
claim: 在过去 12 个月（不含最近 1 个月）涨幅前 20% 的股票里，选上涨日占比最高、涨势最平滑的一半（占股票池 10%），它们在随后 1 个月跑赢同一天的其他股票；在同样的 21 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 投资者对持续、细小的信息不敏感，对一次性的大消息反应充分；由很多小涨日积累的动量更少被定价，延续更久（Da、Gurun、Warachka 2014）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。没有找到公开的复现；和普通动量高度重合，动量崩溃时一起失效。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：原文按动量和信息离散度双重排序、持有 1–6 个月；这里取动量前 20% 中信息离散度最低的、占股票池 10% 的股票，持有 1 个月。
