# Run note for playbook_history_v4 (written 2026-11-11 after the one run; the spec itself is unchanged).
key: playbook_history_v4
run_on: '2026-11-11'
before_the_run: >-
  A mechanics check printed only trade counts, average holdings, signals taken and whether every account value stayed
  finite and positive (no return was looked at): turtles 4.9 / 4.4 stocks held on average (v3 about 1.4), Elder 21.8,
  insider 2,696 signals of which 1,996 taken, PEAD 6,074 / 3,703, breadth thrust 10 trades, CAN SLIM 2.6 stocks
  (at most 8), every trade-level tape at least 423 closed trades. The first compute call stopped before computing
  anything: `holders()` imported a reader from the wrong module (`scout.data.sharadar` instead of
  `scout.sharadar_research`); fixed, no result had been written.
fixes_after_the_run: >-
  Two reporting fixes, no number of the portfolio runs changed. (1) The trade-level table printed the pooled mean over
  trades beside a t computed on entry-month means (the registered statistic), so a few rows showed a positive mean with a
  negative t; the table was rebuilt from the same tapes (same trade counts, asserted) with the entry-month mean, the
  pooled mean kept as `trade_mean`; the first result is kept locally as result_run1.json. (2) The report text failed on
  breadth thrust's list of signal dates and printed the share of signals taken with a plus sign.
audit_after_the_run: >-
  The turtles are still far worse with the intraday stop fill than with the next-open control (−8.7 % vs −0.9 % a year
  for system 1). The breakout level excludes the day's own high (`_rolling` shifts by one session), entries fill at
  max(open, level) and exits at min(open, stop); v3's run note already traced the same gap. Intraday whipsaws on
  stocks, not a code error.
result: >-
  Same window 2008-06-30..2026-10-28: SPY +12.3 % a year (−47 %), equal-weight top 1000 +10.0 % (−52 %). With the
  configurations fixed, no playbook's monthly excess reaches t 3, and the fixes did not rescue any of them. Turtles
  −8.7 % / −6.0 % (v3 −11.7 % / −8.6 %; t −5.1 / −3.6); Elder −1.7 % (t −4.1, drawdown −34 % instead of −53 %); insider
  clusters held 6 months +5.5 % (t −2.8; v3 +8.5 %); PEAD in event time +8.8 % (t −0.5); CAN SLIM with the flat-base
  entry and O'Neil's exits +1.9 % (t −2.3; v3 +4.8 %), with I from 2013-11 −0.4 % vs +1.5 % without and the pool
  +10.2 %; breadth thrust held 12 months +12.9 % vs SPY +12.3 % with −27 % drawdown (t 0.1; SPY rose in the 12 months
  after 29 of 30 signals). 1/50 per signal (wilcox, golden cross,
  MACD, Wyckoff, chart patterns, Livermore): +3.1 %..+11.6 %, |t| ≤ 0.4 except MACD −0.55 % a month (t −3.6); the
  money was mostly tied up (1–12 % of signals taken). Full Sharadar fields: Greenblatt +10.3 % (t 0.3), Piotroski with
  all 9 signals +7.8 %, trending value +12.3 % (t 1.2), Lynch +9.4 %, Graham with the book's 10-year tests +6.4 %
  (t −1.5, drawdown −18 %, about 3 buys a month). Trade level (every signal, 0.05 % one way): breakout systems lose to
  holding the same stock (turtles −2.3 % a trade, t −16; Darvas −1.0 %, t −6.0; Elder −0.3 %, t −2.5); Connors RSI(2)
  +0.8 % a trade over the equal-weight pool (t 11.1) but filled at the signal close and at the low cost, the
  combination under which v3's portfolio already fell from +9.3 % to −7.1 % a year at 0.20 % one way; insider buys
  +1.4 % vs holding the stock (t 1.7), −2.0 % vs SPY. Top 3000: trending value +11.5 % (t 1.5), Lynch +11.2 % (t 1.4),
  pool +8.5 %. Descriptive: no status changes.
