title: 财报公告反应漂移：公告前后 3 日涨得最多的股票继续跑赢
claim: 最近一周结束财报公告窗口的股票里，公告前后 3 个交易日相对 SPY 涨幅前 20% 的股票，在随后一个季度（63 个交易日）跑赢同一天的其他股票。
mechanism: 市场对财报信息反应不足，公告当时的价格反应只消化了一部分，之后继续同向漂移（Brandt、Kishore、Santa-Clara、Venkatachalam 2008；PEAD 文献）。
expected_failure: 公告时间（盘前 / 盘后）没有记录，3 日窗口可能混入公告前的走势；大盘股的漂移在 2000 年后明显减弱。
deviations: 公告日取 SEC 8-K 2.02 项申报日；只做多前 20%；每 5 个交易日调仓一次，持有 63 个交易日（重叠持有）。
