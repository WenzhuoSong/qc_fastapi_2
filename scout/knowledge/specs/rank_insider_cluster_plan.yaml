title: 内部人集中买入：至少两位高管或董事在公开市场买入 · 持仓计划卖出
claim: 最近 90 天至少两位高管或董事在公开市场买入本公司普通股（剔除 10b5-1 计划）的股票，在随后一个季度跑赢同一天的其他股票；在同样的 63 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 内部人最了解公司，主动用自己的钱买入是强信号，多人同时买入的信息含量更高；卖出多为计划性交易，信息含量低（Lakonishok、Lee 2001；Cohen、Malloy、Pomorski 2012）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。大盘股里集中买入很少，样本可能不足；10b5-1 标记 2023 年前不全，早期样本里混有计划交易。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：只用 SEC 季度数据集里的第一位申报人身份；每 21 个交易日检查一次，持有 63 个交易日；不区分买入金额。
