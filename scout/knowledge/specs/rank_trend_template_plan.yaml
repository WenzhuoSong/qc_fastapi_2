title: Minervini 趋势模板：TradingView 上最常见的趋势选股 · 持仓计划卖出
claim: 同时满足 Minervini 趋势模板 8 项条件的股票，在随后 1 个月跑赢同一天的其他股票；在同样的 21 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 只买处于第二阶段上升趋势、相对强度靠前、接近高点的股票，顺着机构资金的方向（Minervini《股票魔法师》）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。这是实践派的筛选条件，没有公开的严格回测；在趋势末期和急速反转时，满足条件的股票集中在同一批强势股上，可能一起回撤。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：原方法还要求等待波动收缩后的突破买点和止损，这里只检验筛选条件本身，按固定 1 个月持有；相对强度用 Scout 的全市场分位。
