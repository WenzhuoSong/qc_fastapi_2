# Pre-registration (G0), written 2026-10-28 before any run. Never edited after a run.
key: volume_shock_plan
family: volume_shock
detector: volume_shock
exit: plan
primary_control: select
title: 放量异动 · 持仓计划卖出
claim: 放量异动规则（无跳空的情况下当日放量 ≥3 倍并大涨，收在日内高位（盘中资金吸筹））按规则的入场区间成交后，在 10 个交易日的窗口内按持仓计划卖出，跑赢同一天、用同样入场公式和卖出规则的其他股票。
mechanism: 规则原本的依据不变（无跳空的情况下当日放量 ≥3 倍并大涨，收在日内高位（盘中资金吸筹））；持仓计划让赢家多拿（到目标 1 后改用吊灯止损），亏损有结构止损封顶。
expected_failure: 这条规则用原卖出方式回放时没有独立优势（知识库已记为否定）；卖出规则对策略股和对照股一视同仁，本身不制造选股优势。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 持有窗口沿用规则原来的持有上限 10 个交易日（不超过 60）；入场区间、触发窗口 3 个交易日不变。
registered_on: '2026-10-28'
registration_note: 2026-10-28 用户要求：所有已否定的策略按持仓计划的卖出规则各重测一次。选股/入场条件、持有窗口与原规格相同，只换卖出规则；对照股票用同样的卖出规则。计入原族的检验次数。 这条规则以前用 eval_rules 回放否定，那次不在 gate_runs 里，本族的计数从这次开始，但它已不是第一次被检验。
