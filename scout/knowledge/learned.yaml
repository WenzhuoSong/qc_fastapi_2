- key: small_cap_rankers_v1
  kind: method
  polarity: negative
  status: rejected
  title: 五种文献选股方法在小盘股（市值第 1001–3000 名）上扣成本后都没有超额；毛利和净回购扣成本前有信号，但被估计的成本吃光
  claim: 1999–2026 年（公告漂移 2004 起、内部人 2008 起），每笔持有 63 个交易日、扣往返成本后相对同期其他可交易小盘股：公告漂移 -1.04%（t -3.21）、毛利 / 总资产 -0.13%（t -0.53）、净回购 +0.01%（t 0.04）、内部人集中买入 -1.10%（t -4.85）、12−1 动量 -0.56%（t -1.30）；五项都不满足任何一条通过条件。扣成本前，毛利 +0.87%（t 3.58）、净回购 +0.89%（t 3.13），其余三项接近 0。
  mechanism: 入选股票的估计往返成本约 0.85%–1.1%，与毛利、净回购每 63 日约 0.9% 的毛超额相当；公告漂移和内部人集中买入（含私下买入、无法排除 10b5-1）在这个样本里扣成本前就没有超额。成本模型 v1（Abdi-Ranaldo 日线价差 + 平方根冲击）对流动性好的股票明显偏高：同一方法在前 1000 大股票上估计的往返成本约 0.55%–0.72%，现实大约 0.05%–0.1%，所以"被成本吃光"取决于一个可能偏高、未经实时报价验证的成本估计。
  context: {kind: [stock], size: [small]}
  applies: {topics: [entry, screen]}
  evidence:
    - source: small_cap_rankers_v1
      date: 2026-11-03
      summary: 329 次月度调仓（公告漂移 1104 次、每 5 日；内部人 223 次），每次入选约 147 只（公告漂移 24、内部人 115）；无法成交 0.00%–0.04%。不扣成本 / 价差 × 2：公告漂移 -0.07% / -1.80%，毛利 +0.87% / -0.92%，净回购 +0.89% / -0.69%，内部人 -0.06% / -1.92%，动量 +0.53% / -1.42%。2016 年起：毛利 -0.44%、净回购 -0.24%、动量 -0.14%（扣成本后）。同样方法在前 1000（同一成本模型）扣成本后：公告漂移 -0.65%、毛利 -0.17%、净回购 +0.37%（t 1.58，扣成本前 +0.92% t 3.87）、内部人 -1.32%、动量 +0.13%。报价抽查经用户决定跳过（免费数据没有带时间戳的买卖价）。
