# Pre-registration (G0), written 2026-10-31 before any chart pattern was detected on any data. Never edited after a run; one run.
# Run on the local Sharadar files (not the Scout panel): `python -m scout.jobs.eval_chart_patterns compute | record`.
key: chart_patterns_lmw
family: chart_patterns
type: event
primary_control: select
hold: 21
title: 经典图表形态（头肩、扩散、三角、矩形、双顶双底）之后的走势
claim: 用 Lo, Mamaysky & Wang (2000) 的算法识别的十种经典形态，形态完成后买入持有 21 个交易日，相对同一窗口股票池其他股票有可靠的超额（看涨形态为正、看跌形态为负）。
mechanism: 《股票趋势技术分析》（Edwards & Magee）第 6–10 章把这些形态视为供需转换的痕迹：头肩顶、双顶、扩散顶预示下跌，头肩底、双底预示上涨；三角形与矩形多为整理，方向取决于突破。Lo, Mamaysky & Wang (2000, JF) 发现 1962–1996 年部分形态之后的收益分布与无条件分布不同（Nasdaq 更明显），但没有检验超额收益；Savin, Weller & Zvingelis (2007, JFEc) 发现带颈线突破的头肩顶之后 1–3 个月有负的风险调整收益。
expected_failure: 形态在大盘股、2000 年之后可能已被套利；LMW 的检验是分布差异，不是收益，分布差异可能来自波动而不是方向；三角形和矩形的方向书中本就不确定；35 日窗口只能捕捉短形态，书中很多形态要几个月；样本里形态出现很频繁，可能把噪声当形态。

definitions:
  source: Lo, Mamaysky & Wang (2000), "Foundations of Technical Analysis", Journal of Finance 55(4), 1705–1765，第二节 A–B（定义 1–5、识别算法）。以下按原文逐条实现
  data: Sharadar（本地 git 忽略的 exports/sharadar/），与 sharadar_rechecks / shock_reversal 相同的点时股票池、价格和退市处理
  universe: 时点正确的市值前 1000（含后来退市的公司），成员取检出日当天或之前最近一次 21 日调仓日名单（自 1999-01-04 起每 21 个交易日）
  sample: 检出日从 1999-03-01 起（第一个 38 日窗口之后）到持有 63 日窗口仍完整的最后一天；全部年份，没有保留期（这些形态从未在这些数据上看过）
  price: 窗口内用 closeadj（含分红复权的收盘价）；38 个价格都必须有值，否则该窗口不识别
  window: l = 35，d = 3，每个窗口 38 个交易日 [t, t+37]，逐日滚动（LMW 原文参数）
  smoothing: Nadaraya–Watson 核回归，高斯核，自变量为窗口内的交易日序号 0..37；带宽 h = 0.3 × h*，h* 为留一交叉验证误差最小的带宽（LMW 式 12–13 与第一节的 0.3 倍规则），在 0.5 到 20 个交易日的 25 个等比网格点上选取，每个窗口单独选
  extrema: 在 37 个相邻差分 m(k+1) − m(k) 上找符号变化（差分为 0 时沿用前一个非零符号，LMW 对平价的处理），由正变负为极大、由负变正为极小，位置 k ∈ 1..36；每个极值取原始价格在 [k−1, k+1] 内的最高（极大）或最低（极小）价作为该极值的价格。极值天然交替
  completion: 形态的最后一个极值必须落在窗口第 35 天（k = 34，即 t+l−1，LMW 的完成条件）；检出日为窗口最后一天 t+37（滞后 d = 3 天）
  patterns: |
    E1..E5 为以完成日极值结尾的连续五个极值（头肩、扩散、三角、矩形）：
    HS：E1 为极大；E3 > E1，E3 > E5；E1 与 E5 在两者均值的 1.5% 以内；E2 与 E4 在两者均值的 1.5% 以内
    IHS：E1 为极小；E3 < E1，E3 < E5；同样的两个 1.5% 条件
    BTOP：E1 为极大；E1 < E3 < E5；E2 > E4
    BBOT：E1 为极小；E1 > E3 > E5；E2 < E4
    TTOP：E1 为极大；E1 > E3 > E5；E2 < E4
    TBOT：E1 为极小；E1 < E3 < E5；E2 > E4
    RTOP：E1 为极大；三个顶（E1、E3、E5）都在其均值的 0.75% 以内；两个底（E2、E4）都在其均值的 0.75% 以内；最低的顶 > 最高的底
    RBOT：E1 为极小；三个底（E1、E3、E5）都在其均值的 0.75% 以内；两个顶（E2、E4）都在其均值的 0.75% 以内；最低的顶 > 最高的底
    双顶双底（定义 5）：E1 为窗口内第一个极值，最后一个极值在完成日；Ea = E1 之后所有极大中的最高者，Eb = E1 之后所有极小中的最低者
    DTOP：E1 为极大；E1 与 Ea 在两者均值的 1.5% 以内；Ea 与 E1 相隔 > 22 个交易日
    DBOT：E1 为极小；E1 与 Eb 在两者均值的 1.5% 以内；Eb 与 E1 相隔 > 22 个交易日
    （"相隔"按平滑后极值的交易日序号计；一个窗口可同时满足多个定义，各自计入）
  dedupe: 同一股票、同一形态，在前一次检出的持有 21 日窗口结束前再次检出的不计
  entry_exit: 检出日的次日开盘买入，持有 21 个交易日（到第 21 个交易日收盘），收益含分红；退市按 sharadar_rechecks 的规则结算
  control: 选股对照（主对照）= 同一窗口（同样的次日开盘到第 21 个交易日收盘）里成员名单其他所有股票的平均收益；差值按月平均后算 t（gate.monthly_t）

direction:
  book: 书中方向明确的五种：HS −、DTOP −、BTOP −（看跌），IHS +、DBOT +（看涨）
  open: BBOT、TTOP、TBOT、RTOP、RBOT 书中方向取决于之前的趋势和突破方向，不预设方向（双侧）

verdict:
  trials: 本族十项同时检验，每项的门槛都是 gate.required_t(10)（Bonferroni：α = 0.05 双侧、十次对应 z ≈ 2.81，低于 3，所以门槛为 |t| ≥ 3）
  pass_book: 方向明确的五种：全样本按月 t 的符号与书中方向一致且 |t| ≥ 门槛，且按检出日期中位数分成的前后两半超额符号都与书中方向一致 → G1 通过
  pass_open: 其他五种：|t| ≥ 门槛，且前后两半超额同号 → G1 通过（方向由数据给出，在报告中写明这是事后方向）
  opposite: 方向明确的形态若满足 |t| ≥ 门槛且两半同号、但方向与书相反，记为"与书相反"，G1 不通过
  use: 看涨方向通过 → 进入批判关（gate.critique），通过后 backtested，进入前向验证，之后才可能成为 Scout 的买点规则；看跌方向通过 → 同样过批判关和前向验证，只作为风险提示（Scout 不做空）；只有用户能确认
  fail: G1 不满足 → 该形态的知识库条目改为 rejected（否定结论保留），不调参、不重测
  not_checked: 与已通过规则（breakout_retest_selection）的月度相关需要 Scout 面板上的成交，Sharadar 上没有；若有形态通过 G1，在批判关里说明
  reported_only: 持有 1 日（LMW 研究的对象：检出日收盘到次日收盘）、5 日、63 日；窗口内成交量后半段 / 前半段 > 1.2（放量）与 < 1/1.2（缩量）分组（LMW 第三节 D 的 1.2 倍，改在窗口内计算）；第 32 章的量度目标（HS / IHS：头到颈线的距离从颈线 (E2+E4)/2 起量；DTOP / DBOT：顶（底）到中间最低（最高）收盘的距离从该点起量）在 63 日内达到的比例，与同窗口其他股票达到同样百分比幅度的比例对比；每年检出次数；去掉 2008–09；熊市月份（osap_check.BEARS）；2016 年以后。这些不影响结论

family_note: 新的一族（chart_patterns），此前没有检验过；本次十项同时运行，门槛按十次计。之后若检验书中的其他形态（旗形、楔形、圆底、趋势线、第 5 章 Magee 基点止损），计入同一族，门槛按累计次数提高。
disclosure: |
  登记前没有在任何数据上运行过形态识别，也没有看过形态之后的收益。LMW 的定义和参数（l、d、0.3 倍带宽、1.5% / 0.75%、22 日）全部照搬原文，没有调整。
  原文没有明确写出的地方由本规格决定：交叉验证的带宽网格；差分为 0 的处理细节；双顶双底的"最后一个极值落在完成日"（原文对所有形态要求完成的极值在 t+l−1）；用 closeadj 而不是未复权价格；成交量分组在窗口内而不是五年子期内。
  2022 年以后的数据是机器学习排名研究保留的最终检验期，但那是另一组假设；形态族从未在任何年份看过，因此使用全部样本，结果会单独报告 2016 年以后。
deviations: LMW 检验的是收益分布差异（KS 检验），本规格检验相对同窗口股票池的平均超额收益；只用市值前 1000 的点时股票池；检出后次日开盘买入，不是 LMW 的检出日收盘；不做空；与 breakout_retest 的相关不检查（见 verdict.not_checked）。
registered_on: '2026-10-31'
