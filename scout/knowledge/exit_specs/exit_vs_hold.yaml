# Pre-registration of the exit study against simply holding, written 2026-10-28 before any run.
# Never edited after a run; a changed design is a new file with a new key. Run once:
# `python -m scout.jobs.eval_exit_hold`.
key: exit_vs_hold
registered_on: '2026-10-28'
requested_by: 用户 2026-10-28："按这个方案预登记并开始测"
question: 持仓计划的卖出规则，以及文献里的几种跟踪止损，相比一直持有，在风险调整后是否不差、回撤是否明显更小？

sample:
  universe: 当天的股票池（价格 ≥ 5 美元、20 日均成交额 ≥ 2000 万美元、满一年历史；当前 S&P 500 / 400 与 Nasdaq-100 成分股，含幸存者偏差）
  buys: 从第一年之后起，每 20 个交易日，股票池里每只股票次日开盘买入（与选股无关，测的是卖出方式本身）
  window: 60 个交易日（持仓计划的持有上限），窗口最后一天收盘卖出余下仓位
  same_trades: 每笔买入在所有方案下都必须有结果（持仓计划算不出价位的买入在所有方案里一起剔除）
  cash: 提前卖出的钱按前一天的 3 个月美债收益率（FRED DGS3MO / 252）逐日计息，到窗口结束
  cost: 每笔往返 0.1%，所有方案（包括一直持有）都扣一次
  daily_bars: 日线；盘中止损先于目标检查，跳空穿过止损按开盘价成交；收盘判断的止损在次日开盘卖出

policies:
  hold: 一直持有到窗口结束（基准）
  plan: 现行持仓计划（scout/plan_exit.py）：买入前一天收盘的价位图给初始止损；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR14，只升不降，盘中触发）；不分批
  plan_wide: 同现行持仓计划，但初始止损至少离买入价 3×ATR14（取计划止损与 买入价 − 3×ATR14 中较低的一个）；目标不变
  atr10: Wilcox & Crittenden（2005）/ Zarattini、Pagani、Wilcox（2025）：止损 = 买入以来最高收盘 − 10×ATR42（42 日真实波幅简单平均），只升不降，从买入当天起生效；收盘跌破，次日开盘卖出
  chandelier: LeBeau 吊灯止损：止损 = 买入以来最高价 − 3×ATR22（22 日真实波幅简单平均），只升不降，从买入当天起生效；收盘跌破，次日开盘卖出
  trail20: Snorrason & Yusupov（2009）：止损 = 买入以来最高收盘 × 0.8，只升不降；收盘跌破，次日开盘卖出

metrics:
  portfolio: 每 20 天一批、每批持有 60 天，形成 3 个交替的子组合，等权合成每日净值；年化收益、年化波动、夏普（扣 3 个月美债收益率）、Sortino、最大回撤、最差 63 日收益；前后两半（按买入批次日期中位数分）分别计算夏普和最大回撤
  trades: 每笔净收益的均值、中位数、最差 5% 的平均、偏度、胜率、提前卖出的比例、平均持有天数；与一直持有的逐笔差值，按月平均后的 t 值，前后两半

decision:
  candidate: 一个方案要满足全部三条才算可以替换现行计划
    - 前后两半的组合夏普都不低于一直持有
    - 全样本组合最大回撤比一直持有至少小 5 个百分点
    - 最差 5% 交易的平均亏损小于一直持有
  pick: 多个方案满足时，推荐全样本组合夏普最高的一个；是否改持仓计划由用户确认
  none: 没有方案满足时，不推荐替换，结果记入知识库（包括现行计划与一直持有的比较）
  trials: 本次共 5 个方案对比一直持有，各跑一次；参数全部取自文献或事先说明，不做调整

expected_failure: 文献（Lo & Remorov 2017；Clare 等 2013）认为个股上的止损多半降低原始收益；样本是 2015–2026 年的牛市，且股票池有幸存者偏差（被剔除指数的跌落者不在样本里），对止损不利。
