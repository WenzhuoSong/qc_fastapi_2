title: MACD 金叉（12/26/9） · 持仓计划卖出
claim: 当天 MACD 柱由负转正（MACD 线上穿信号线）的股票，次日开盘买入、持有 20 个交易日，跑赢同一天的其他股票；在同样的 20 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: MACD 是两条指数均线之差，金叉表示短期动能转强；如果投资者对新信息反应不足，动能转强之后价格会延续一段（Appel 1979；技术分析常用）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。控制数据挖掘后的研究普遍发现这类技术规则不赚钱（Sullivan、Timmermann、White 1999；Park、Irwin 2007）；金叉在震荡市里频繁来回，假信号多。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：原始用法在死叉时卖出，这里固定持有 20 个交易日，以便和对照用同样的持有期；参数用标准 12/26/9，不做调整；不做空死叉。
