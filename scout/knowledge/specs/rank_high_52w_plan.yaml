title: 52 周高点接近度：离一年高点越近越强 · 持仓计划卖出
claim: 按收盘价除以过去 52 周最高价排名，前 10% 的股票在随后 1 个月跑赢同一天的其他股票；在同样的 21 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 投资者把 52 周高点当作锚，好消息把股价推近高点时，他们不敢追，信息被慢慢消化（George、Hwang 2004）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。有研究发现部分市场 2001 年后这个效应转负；在下跌市里接近高点的多是防御股，可能跑输。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：原文持有 6 个月，这里持有 1 个月（Scout 的使用周期）；只做多前 10%。
