title: Elder 三重滤网（周线定方向，日线等回调）
claim: 最近一根完整周线的 MACD 柱上升（周线趋势转强），且当天日线 2 日强力指数刚转为负（顺着周线方向的短暂回调）的股票，次日开盘买入、持有 20 个交易日，跑赢同一天的其他股票。
mechanism: 长周期决定方向，短周期找逆向的入场点：在周线动能向上时买日线的回调，比追涨更有利（Elder 1986《Trading for a Living》三重滤网；强力指数 = 价格变化 × 成交量）。
expected_failure: 和其他技术规则一样，控制数据挖掘后可能没有优势；周线 MACD 柱的上升可能只是下降趋势中的减速；固定持有期可能和原法的止损 / 止盈差异很大。
deviations: 原法第三层用前一日高点上方的买入止损单入场，这里改为次日开盘买入；原法按止损和目标离场，这里固定持有 20 个交易日（与 MACD 规格一致，不是挑出来的）；只做多。
