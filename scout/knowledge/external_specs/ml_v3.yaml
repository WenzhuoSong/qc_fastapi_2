# Pre-registration of ML stage 3 (sequence models), written 2026-10-30 after ml_confirm_v1 and ml_v2b
# and before any sequence was built or model trained. Discovery period only. Never edited after a run.
key: ml_v3
registered_on: '2026-10-30'
requested_by: 用户 2026-10-30："好，跑完告诉我结果，然后再开始尝试序列模型，比如LSTM、马尔可夫链、attention"；"好，装好 PyTorch，跑完就预登记第三阶段"
question: 直接从过去一年的逐日价量序列学习（马尔可夫链、LSTM、注意力），能否得到手工价量特征之外的排名信息？与第 2b 阶段最好的树（b4）融合后，能否提高 IC？

data:
  rows: 与特征库 v1 相同的（截面日期, 股票）样本与标签；挖掘期 2004-01 至 2015-12；2016 年以后不读取
  sequence: 截至样本日收盘（含）的 250 个交易日，按 5 日切成 50 个片段（token）
  channels: 7 个逐日通道，全部只用当日及以前的数据
    - 复权收盘的对数收益
    - 对数收益减 SPY 对数收益
    - 成交额 / 此前 63 日平均成交额，取对数
    - 当日最高 / 最低，取对数
    - 隔夜跳空：复权开盘 / 前一日复权收盘，取对数
    - SPY 对数收益
    - 有效标记（当天有价格为 1，否则 0；缺失的通道值填 0）
  scaling: 每个通道除以 1999–2003（预热期）样本上的标准差（固定，与以后的数据无关），截断到 ±10
  storage: 通道数组与模型只写本地 exports/ml/（Sharadar 衍生，退订时一起删除）

target: 训练目标 = 行业中性标签（y_sec）的当天截面排名（[−1, 1]），这是第 2b 阶段挖掘期的结论；评估仍用主标签（减去股票池平均）

models:
  markov: 三阶马尔可夫链。每周一个状态：5 日超额收益（相对 SPY）按预热期分位数分 5 档 × 5 日成交额高于 / 低于此前 63 日平均分 2 档 = 10 个状态；最近 3 周的状态组合（1000 种）；分数 = 训练样本中该组合的目标平均值，向 0 收缩（总和 / (样本数 + 1000)）
  lstm: 片段嵌入（35 → 64），2 层 LSTM（隐藏 64，dropout 0.1），最后一步 → 32 → 1
  attention: 片段嵌入（35 → 64）+ 可学习位置编码 + CLS，2 层 Transformer 编码器（4 头，前馈 128，dropout 0.1），CLS → 32 → 1
  note: LSTM 与注意力的输入完全相同，只差序列混合方式；只用价量序列，不输入截面特征（截面信息由融合加入）
training:
  versions: 每年 1 月一个版本（2004–2015 共 12 个）；训练样本 = 标签结束 + N 个交易日早于当年第一个样本的全部样本；内部验证 = 训练集最后 12 个月（与拟合部分隔离 1.5 N 天）
  nets: AdamW（学习率 1e-3，权重衰减 1e-2），批量 1024，损失 MSE；每轮从拟合部分随机抽 30 万个序列；第一个版本从随机初始化（种子 7）最多 15 轮，此后每个版本从上一版本的权重开始最多 5 轮；验证期 IC 连续 2 轮不提高即停，保留最好的一轮
  markov: 每个版本用全部训练样本重新计数
  hyperparameters: 全部固定，不做搜索
fusion: fuse_<模型> = 当天 b4 分数排名与该序列模型分数排名的平均（固定等权，不训练）；b4 分数用第 2b 阶段保存的季度版本（exports/ml/ckpt）重新预测，不重训
trials: 3 个模型 × 2 个周期 = 6 次训练，融合 6 次（无训练）；全部记入研究文档

metrics: 与 ml_v2 相同（IC 与 t、前 10% 相对其他股票的超额、前后两半、分市况）
decision:
  model_candidate: 满足 ml_v2 的候选标准（IC t ≥ 3、IC 前后两半为正、前 10% 超额前后两半为正）
  fusion_increment: 融合相对 b4 的增量 = 每天 IC 之差；增量成立要求全样本均值 > 0、按月 t ≥ 2、前后两半都为正
  meaning: 单个序列模型达到候选，说明序列中有可学习的信息；融合增量成立，说明这部分信息不在现有特征里
  next: 有候选或增量成立时，确认期检验另行预登记（确认期第二次使用，写明）并同时做前向检验；都不成立时，大中盘价量序列记为否定结果
