# Pre-registration of the ML stock-ranking work, stage 1 (feature store v1 + baselines), written
# 2026-10-29 before any feature or label was computed. Never edited after a run; later stages get
# their own files. Stage 1 looks only at the discovery period.
key: ml_v1
registered_on: '2026-10-29'
requested_by: 用户 2026-10-29："两个周期都做，先做大中盘，先做特征库和基线"（类型化特征算子、时间序列特征、前推训练）
question: 用时点正确的多类特征（股票自身、基本面、持有人、情境、规则信号）预测未来 21 / 63 个交易日的截面排名，是否比单个因子和简单综合分更好？

data:
  source: 本地 Sharadar（exports/sharadar/，git 忽略）+ FRED（VIXCLS、T10Y2Y、DGS3MO）
  universe: sharadar_rechecks 的大中盘股票池（当天市值前 1000，含后来退市的公司）
  sample_dates: 1999-01 起每 5 个交易日一个截面
  storage: 特征与标签写入 exports/ml/（git 忽略，属于 Sharadar 衍生数据，退订时与原始数据一起删除）；模型与汇总评估可保留

periods:
  warmup: 1999-01 至 2003-12（只用于第一次训练）
  discovery: 2004-01 至 2015-12（第一阶段只在这里评估，可以迭代）
  confirmation: 2016-01 至今（第一阶段完全不碰：不计算任何指标、不画图、不看分布；最终模型另行预登记后只用一次）

labels:
  return: 次日开盘买入到第 N 个交易日收盘（含分红），退市按 sharadar_rechecks 的规则结算；N = 21 与 63
  target: 收益减去当天股票池平均（主标签）；另存减去同行业平均的版本；训练用当天的截面排名映射到 [−1, 1]

features_v1:
  price_volume: 1 / 5 / 21 / 63 / 126 / 252 日收益，12−1 月动量，21 / 63 日波动，63 日下行波动，252 日对 SPY 的 beta 与特质波动，63 / 252 日最大回撤，距 52 周高点 / 低点，收盘相对 20 / 50 / 200 日均线，RSI14，MACD 柱 / 价格，21 日成交额（对数），21 日 / 126 日成交额之比，21 日 Amihud 非流动性，63 日收益偏度
  fundamentals: 市值（对数），账面市值比，盈利收益率，销售收益率，EBITDA / EV，毛利 / 总资产，ROE，ROA，应计（净利润 − 经营现金流）/ 平均总资产，总资产同比，销售同比，股本同比（净发行），负债 / 总资产，资本开支 / 总资产，研发 / 销售；季度用 ARQ、滚动 12 个月用 ART，按申报日 datekey 时点正确
  events_holders: 最近一次财报公告（8-K 2.02）前后 3 日相对 SPY 的收益及距今天数（63 日内），近 90 日高管 / 董事公开市场净买入（交易代码 P 减 S）占市值，机构持股股数季度变化（按季末日期滞后 45 天）
  time_series: 对动量、波动、估值、盈利能力各取过去 63 日截面排名的变化
  context: SPY 21 / 63 / 252 日收益，SPY 21 日波动，VIX，10 年 − 2 年利差，市场宽度（股票池中高于 200 日线的比例），所属行业 ETF 63 日相对 SPY
  categorical: 行业（Sharadar sector，无序），细分行业（无序），市值规模等级（有序），市况（上升 / 震荡 / 下降，有序），波动状态（高 / 低）
  rule_signals: 突破回踩是否在近 10 日触发（布尔）

operators:
  cross_sectional_numeric: 每个日期内 1% / 99% 缩尾 → 截面排名映射到 [−1, 1]；缺失填 0 并加缺失标记；另存行业中性排名（行业内排名）
  context_numeric: 扩张窗口 z 分数（只用此前的历史），不做截面排名
  ordinal: 整数编码
  nominal: 线性模型用 one-hot；树模型用原生类别；不用目标编码

walk_forward:
  scheme: 冷启动用 warmup 期训练；之后每月一次：round0 用当前版本对标签已完整的最近一个月样本评估，round1 只用标签已完整的样本（标签结束日 + N 个交易日的隔离期早于训练日）重新训练，产出新版本
  baselines:
    momentum: 12−1 月动量的截面排名（无训练）
    composite: 学术上有效信号的等权综合（净发行取负、毛利 / 总资产、财报公告收益、12−1 月动量），各自截面排名后平均（无训练）
    ridge: 岭回归，全部截面排名特征 + 情境 z 分数 + 类别 one-hot + 少量交互（动量 × 大盘 252 日收益、动量 × VIX），正则强度在训练集内用前推折选择
  metrics: 每个截面的 Spearman IC 及其按月均值的 t 值（按 N 做重叠校正）；预测前 10% 相对股票池其他股票的超额（检验关口径），前后两半；分市况、分行业
  discovery_only: 第一阶段所有指标只在 2004–2015 计算

limits: 只做大中盘；不含 AI 判断；序列模型（attention）放到第三阶段；第一阶段的结果只用于决定第二阶段（LightGBM）的设计，不进入检验关，也不改变任何知识库状态
