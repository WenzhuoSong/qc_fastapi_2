- key: sector_rotation_no_edge
  kind: rule
  polarity: negative
  status: rejected
  title: 板块轮动龙头：没有优势
  claim: 行业由弱转强时买入行业内相对强度最高的股票，相对各种对照都没有优势，后半段选时反而为负。
  context: {kind: [stock]}
  applies: {detectors: [sector_rotation]}
  evidence:
