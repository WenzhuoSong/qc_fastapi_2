title: 财报公告反应漂移：公告前后 3 日涨得最多的股票继续跑赢 · 持仓计划卖出
claim: 最近一周结束财报公告窗口的股票里，公告前后 3 个交易日相对 SPY 涨幅前 20% 的股票，在随后一个季度（63 个交易日）跑赢同一天的其他股票；在同样的 63 个交易日窗口内按持仓计划止损和跟踪止损卖出（提前卖出后不再投资），同样跑赢按同一卖出规则买入的同日其他股票。
mechanism: 市场对财报信息反应不足，公告当时的价格反应只消化了一部分，之后继续同向漂移（Brandt、Kishore、Santa-Clara、Venkatachalam 2008；PEAD 文献）。
expected_failure: 原规格（到期按收盘卖出）已被否定；卖出规则对策略股和对照股一视同仁，本身不应制造选股优势。如果原规格没有选股优势，换卖出规则大概率也没有。公告时间（盘前 / 盘后）没有记录，3 日窗口可能混入公告前的走势；大盘股的漂移在 2000 年后明显减弱。
deviations: 卖出规则改为持仓计划：买入后用价位图在买入前一天收盘算出的初始止损（结构位下方，至少 1 个 ATR）；到目标 1 不卖，止损改为吊灯止损（买入以来最高收盘 − 3×ATR，只升不降）；不分批；最长 60 个交易日。 原规格说明：公告日取 SEC 8-K 2.02 项申报日；只做多前 20%；每 5 个交易日调仓一次，持有 63 个交易日（重叠持有）。
